<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سيستم صيانة بايونير</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: شريط علوي + تبويبات أفقية + محتوى بعرض 1100 بكسل؛ ورقة التقرير بعرض A4؛ بوابة العيادة عمود واحد 640 */
:root{
  /* هوية داكنة بنفسجي-نيلي، ثيم واحد مقصود */
  --bg:#110e33; --surface:#1c1850; --surface-2:#252062; --ink:#eeecff; --muted:#a6a2d6; --line:#322c74;
  --accent:#7457ff; --accent-2:#a347ff; --accent-soft:#2e2576; --accent-ink:#ffffff;
  --ok:#3fdc9c; --ok-soft:#173f3a; --warn:#ffbb55; --warn-soft:#433416; --bad:#ff5f80; --bad-soft:#4a1a33;
  --info:#4fd6ee; --info-soft:#173a4f;
  --header:#16133f; --header-ink:#eeecff;
  --g1:linear-gradient(135deg,#5b4dff,#7a5cff); --g2:linear-gradient(135deg,#14b8c4,#22d3c5);
  --g3:linear-gradient(135deg,#8a1fe0,#b13cff); --g4:linear-gradient(135deg,#d01fb8,#ff3cc8);
  --font:"IBM Plex Sans Arabic", Tahoma, "Segoe UI", Arial, sans-serif;
  --r:16px; --side:250px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.3}
h2{font-size:1.35rem}
h3{font-size:1.05rem}
a{color:var(--info)}
.top{background:var(--header);color:var(--header-ink);position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line)}
.top-in{padding-block:12px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-bottom:8px}
.brand b{font-size:1.35rem;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
.brand b::before{content:"";width:30px;height:30px;border-radius:9px;background:var(--g1);box-shadow:0 4px 14px rgba(116,87,255,.55);flex:none}
.brand small{color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.hbtn{background:var(--surface-2);border:1px solid var(--line);color:var(--header-ink);border-radius:8px;padding:2px 10px;font-size:.8rem;cursor:pointer}
.hbtn:hover{border-color:var(--accent)}
.mode{font-size:.72rem;border-radius:99px;padding:0 8px;background:var(--surface-2);color:var(--info)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:10px}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;color:var(--muted);padding:9px 14px;border-radius:12px;white-space:nowrap;cursor:pointer;display:flex;align-items:center;gap:10px;font-size:.95rem}
.tab svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab:hover{color:var(--ink);background:var(--surface)}
.tab.on{color:#fff;background:var(--g1);font-weight:600;box-shadow:0 6px 18px rgba(91,77,255,.4)}
.navsec{font-size:.78rem;color:var(--muted);opacity:.8;padding:14px 14px 4px;display:none}
@media (min-width:900px){
  body:not(.nonav){padding-right:var(--side)}
  body:not(.nonav) .top{position:fixed;top:0;bottom:0;right:0;width:var(--side);border-bottom:0;border-left:1px solid var(--line);overflow-y:auto}
  body:not(.nonav) .top-in{padding:22px 16px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;min-height:100%}
  body:not(.nonav) .brand{flex-direction:column;align-items:flex-start;padding-bottom:6px}
  body:not(.nonav) .tabs{flex-direction:column;overflow:visible;padding:0}
  body:not(.nonav) .tab{padding:11px 14px}
  body:not(.nonav) .navsec{display:block}
  body:not(.nonav) main{max-width:1200px}
}
.cnt{background:var(--accent);color:#fff;border-radius:99px;padding:0 7px;font-size:.72rem;margin-inline-start:6px;font-weight:700}
main{max-width:1100px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}
main.narrow{max-width:660px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel h3{margin-bottom:10px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:760px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.g2,.g3{grid-template-columns:minmax(0,1fr)}}
label.f{display:grid;gap:4px;font-size:.85rem;color:var(--muted);min-width:0}
label.f.span2{grid-column:span 2}
@media (max-width:480px){label.f.span2{grid-column:auto}}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0;color:var(--ink)}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;white-space:nowrap;color:var(--ink)}
.btn:hover{background:var(--surface-2)}
.btn:disabled{opacity:.55;cursor:wait}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{padding:4px 10px;font-size:.85rem}
.btn.big{padding:12px 20px;font-size:1.05rem}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:none}
.kpi{display:grid;gap:2px}
.kpi span{color:var(--muted);font-size:.85rem}
.kpi b{font-size:1.45rem}
.tbl-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:.92rem}
.t th{text-align:right;color:var(--muted);font-weight:500;font-size:.8rem;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr.click{cursor:pointer}
.t tr.click:hover td{background:var(--surface-2)}
.t tfoot td{font-weight:700;border-bottom:0}
.num{text-align:left;direction:ltr;unicode-bidi:plaintext;white-space:nowrap}
.pill{display:inline-block;padding:1px 10px;border-radius:99px;font-size:.78rem;font-weight:600;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-acc{background:var(--accent-soft);color:var(--accent)}
.p-info{background:var(--info-soft);color:var(--info)}
.p-mut{background:var(--surface-2);color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.empty{color:var(--muted);padding:16px;text-align:center;border:1px dashed var(--line);border-radius:8px}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:10px 14px}
.banner.info{background:var(--info-soft);color:var(--info)}
.sec-title{font-size:.8rem;color:var(--muted);letter-spacing:.4px;font-weight:600;margin:6px 0 2px}
.part-row{display:grid;grid-template-columns:minmax(0,3fr) 80px 110px 110px 44px 36px;gap:8px;align-items:center}
@media (max-width:640px){.part-row{grid-template-columns:minmax(0,1fr) 70px 90px;padding-bottom:8px;border-bottom:1px solid var(--line)}.part-row .lt{grid-column:1/2}}
.pr-cam{width:44px;height:40px;border:1px dashed var(--line);border-radius:8px;display:grid;place-items:center;cursor:pointer;overflow:hidden;font-size:1.1rem}
.pr-cam img{width:100%;height:100%;object-fit:cover}
.totals{display:grid;gap:4px;max-width:340px;margin-inline-start:auto}
.totals div{display:flex;justify-content:space-between}
.totals .grand{font-size:1.15rem;font-weight:700;border-top:1px solid var(--line);padding-top:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);padding:7px 16px;cursor:pointer;color:var(--ink)}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.sig{border:1px dashed var(--line);border-radius:8px;background:#fff;touch-action:none;width:100%;height:140px;display:block}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.photos figure{margin:0;position:relative}
.photos img{width:96px;height:96px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in}
.photos button{position:absolute;top:2px;left:2px}
.sheet-wrap{overflow-x:auto;background:var(--surface-2);border-radius:var(--r);padding:16px;border:1px solid var(--line)}
.sheet-wrap > div{margin:0 auto;box-shadow:0 2px 14px rgba(0,0,0,.12)}
.modal-bg{position:fixed;inset:0;background:rgba(10,15,20,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:30px 16px}
.modal{background:var(--surface);border-radius:12px;width:100%;max-width:640px;padding:18px;display:grid;gap:12px;border:1px solid var(--line)}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--header);color:var(--header-ink);padding:10px 18px;border-radius:99px;z-index:60;box-shadow:0 4px 16px rgba(0,0,0,.25);max-width:90vw;text-align:center}
.dev-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) 36px;gap:8px}
@media (max-width:480px){.dev-row{grid-template-columns:minmax(0,1fr) 36px}}
.req{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:8px;background:var(--surface);min-width:0}
.req .when{font-weight:600}
.req p{margin:0;white-space:pre-wrap}
.board td{vertical-align:top}
.chip{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:2px 8px;margin:2px;font-size:.82rem;background:var(--surface-2)}
.chip.urg{border-color:var(--bad);color:var(--bad)}
.toggle{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer}
.toggle input{width:22px;height:22px}
.toggle.on{border-color:var(--bad);background:var(--bad-soft)}
.done-card{border:2px solid var(--ok);background:var(--ok-soft);border-radius:var(--r);padding:16px;display:grid;gap:6px}
pre.code{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px;overflow-x:auto;font-size:.78rem;direction:ltr;text-align:left;max-height:260px}
ol.steps{margin:0;padding-right:20px;display:grid;gap:4px}

/* ===== لمسات الهوية الداكنة ===== */
body{background:radial-gradient(1200px 600px at 80% -10%,#221c6b 0%,transparent 60%),var(--bg)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 10px 30px rgba(5,3,30,.35)}
h2{font-size:1.6rem;font-weight:600}
input,select,textarea{background:#15113f;border-color:var(--line);border-radius:10px}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
.btn{border-radius:10px;background:var(--surface-2);border-color:var(--line)}
.btn:hover{background:#2e2876;border-color:var(--accent)}
.btn.pri{background:var(--g1);border-color:transparent;box-shadow:0 6px 16px rgba(91,77,255,.35)}
.btn.ghost{background:none}
.btn.danger{background:none}
.seg{border-color:var(--line);border-radius:12px;background:var(--surface)}
.seg button{background:transparent}
.seg button.on{background:var(--g1)}
.t th{color:var(--muted)}
.t tr.click:hover td{background:var(--surface-2)}
.req{border-radius:var(--r);background:var(--surface)}
.sheet-wrap{background:var(--surface-2)}
.empty{border-color:var(--line)}
.banner{border:1px solid rgba(255,187,85,.3)}
.banner.info{border-color:rgba(79,214,238,.3)}
.modal{border-radius:18px;background:var(--surface);box-shadow:0 30px 80px rgba(0,0,0,.55)}
.modal-bg{background:rgba(6,4,25,.7);backdrop-filter:blur(3px)}
.toast{background:var(--g1);color:#fff}
.chip{background:var(--surface-2);border-color:var(--line)}
/* كروت الأرقام الملونة */
.grid > .panel.kpi{position:relative;overflow:hidden;border:0;color:#fff;min-height:118px;padding:18px 20px;box-shadow:0 12px 28px rgba(10,5,50,.45)}
.grid > .panel.kpi:nth-child(4n+1){background:var(--g1)}
.grid > .panel.kpi:nth-child(4n+2){background:var(--g2)}
.grid > .panel.kpi:nth-child(4n+3){background:var(--g3)}
.grid > .panel.kpi:nth-child(4n+4){background:var(--g4)}
.grid > .panel.kpi span{color:rgba(255,255,255,.88)!important;font-weight:500}
.grid > .panel.kpi b{color:#fff!important;font-size:1.7rem;position:relative;z-index:1}
.grid > .panel.kpi{padding-inline-end:84px}
.grid > .panel.kpi::after{content:"";position:absolute;left:18px;top:50%;margin-top:-26px;width:52px;height:52px;border-radius:50%;border:8px solid rgba(255,255,255,.85);border-right-color:rgba(255,255,255,.25)}
.grid > .panel.kpi::before{content:"";position:absolute;inset:auto auto -40px -40px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.08)}
@media (max-width:760px){.grid > .panel.kpi{padding-inline-end:20px;padding-bottom:58px}.grid > .panel.kpi b{font-size:1.35rem}.grid > .panel.kpi::after{top:auto;bottom:12px;margin-top:0;width:34px;height:34px;border-width:6px}}
@media (max-width:600px){.t td{white-space:nowrap}}
/* إضافات v8 */
.chipc{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:4px 12px;cursor:pointer;background:var(--surface-2);font-size:.88rem}
.chipc input{width:auto;margin:0}
.chipc:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.pr-w{grid-column:1/-1;display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding-bottom:4px}
.pr-w input{width:84px;padding:5px 8px}
.part-row{padding-bottom:8px;border-bottom:1px dashed var(--line)}
.perm-grp{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:6px}
.perm-grp b{font-size:.85rem;color:var(--muted)}
.perm-grp label{display:flex;gap:8px;align-items:center;font-size:.92rem}
.perm-grp input{width:auto}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.92rem}
.kv span:nth-child(odd){color:var(--muted)}
.stat-line{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.stat-line:last-child{border-bottom:0}
.stat-line.tot{font-weight:700;border-top:2px solid var(--line);border-bottom:0}
.neg{color:var(--bad)}.pos{color:var(--ok)}
/* الرسم البياني */
.chart text{fill:var(--muted);font-size:11px;font-family:var(--font)}
.chart .grid-l{stroke:var(--line);stroke-dasharray:3 4}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;vertical-align:middle;margin-inline-end:6px}
@media print{
  .top,.no-print,.toast{display:none!important}
  body{padding:0!important;background:#fff!important}
  body{background:#fff}
  main{padding:0;max-width:none}
  .sheet-wrap{border:0;padding:0;background:#fff;overflow:visible}
  .sheet-wrap > div{box-shadow:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.bell{position:relative}.bell .cnt{margin-inline-start:4px}
.nrow{all:unset;cursor:pointer;display:grid;gap:2px;padding:10px 6px;border-bottom:1px solid var(--line)}.nrow.unread{background:color-mix(in srgb,var(--accent) 10%,transparent);border-radius:8px}.nrow:hover{background:var(--surface-2)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:grid;grid-template-rows:auto 1fr}.pcard.sel{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 30%,transparent)}
.pcard img,.pcard .noimg{width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--surface-2);display:grid;place-items:center;font-size:2.2rem}
.pbody{padding:10px;display:grid;gap:6px;align-content:start}
.qty{display:flex;align-items:center;justify-content:space-between;gap:6px}.qty b{min-width:28px;text-align:center}
.stars{display:flex;gap:4px;direction:ltr;justify-content:flex-end}.stars button{all:unset;cursor:pointer;font-size:1.9rem;color:var(--line);line-height:1}.stars button.on{color:#f5b301}
.stars-t{color:#f5b301;letter-spacing:1px;direction:ltr;display:inline-block}
.cn-img{width:96px;height:96px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;font-size:2rem;overflow:hidden}.cn-img img{width:100%;height:100%;object-fit:cover}
.seg label{padding:7px 18px;cursor:pointer;color:var(--ink)}.seg label.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.offer{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;border-radius:14px;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 22%,var(--surface)),var(--surface));border:1px solid var(--accent)}.offer img,.offer .ofi{width:72px;height:72px;border-radius:10px;object-fit:cover;background:var(--surface-2);display:grid;place-items:center;font-size:2rem;flex:none}
</style>
</head>
<body>
<header class="top no-print">
  <div class="top-in">
    <div class="brand"><b id="brandName">Pioneer</b><small id="brandSub">نظام الصيانة</small></div>
    <nav class="tabs" id="tabs"></nav>
  </div>
</header>
<main id="main"><div class="empty">بيحمّل…</div></main>
<input type="file" id="importFile" accept="application/json" hidden>

<script>
/* =====================================================================
   التخزين المحلي (IndexedDB مع بديل localStorage)
   ===================================================================== */
const DBN='pioneer-maint-v1', ST='kv';
function idb(){return new Promise((res,rej)=>{let done=false;const t=setTimeout(()=>{if(!done){done=true;rej(new Error('idb timeout'))}},1500);try{const r=indexedDB.open(DBN,1);r.onupgradeneeded=()=>r.result.createObjectStore(ST);r.onsuccess=()=>{if(!done){done=true;clearTimeout(t);res(r.result)}};r.onerror=r.onblocked=()=>{if(!done){done=true;clearTimeout(t);rej(r.error)}}}catch(e){done=true;clearTimeout(t);rej(e)}})}
window.addEventListener('error',e=>{const m=document.getElementById('main');if(m&&/بيحمّل/.test(m.textContent))m.innerHTML='<div class="empty">حصلت مشكلة في التشغيل: '+String(e.message).replace(/</g,'&lt;')+'</div>'});
window.addEventListener('unhandledrejection',e=>{const m=document.getElementById('main');if(m&&/بيحمّل/.test(m.textContent))m.innerHTML='<div class="empty">حصلت مشكلة في التشغيل: '+String(e.reason&&e.reason.message||e.reason).replace(/</g,'&lt;')+'</div>'});
async function loadState(){
  try{const db=await idb();const v=await new Promise(res=>{const q=db.transaction(ST).objectStore(ST).get('state');q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)});if(v)return v}catch(e){}
  try{return JSON.parse(localStorage.getItem('pm-state'))}catch(e){return null}
}
let saveTimer=null;
function save(){if(ME&&isStaff())syncCatalog();if(ONLINE){persistOnline();return}clearTimeout(saveTimer);saveTimer=setTimeout(persistLocal,150)}
async function persistLocal(){
  try{const db=await idb();await new Promise((res,rej)=>{const t=db.transaction(ST,'readwrite');t.objectStore(ST).put(S,'state');t.oncomplete=res;t.onerror=()=>rej(t.error)})}
  catch(e){try{localStorage.setItem('pm-state',JSON.stringify(S))}catch(err){if(!persistLocal.warned){persistLocal.warned=1;toast('المتصفح ده مش بيسمح بحفظ البيانات — اللي هتكتبه هيضيع لما تقفل الصفحة')}}}
}

/* =====================================================================
   أدوات
   ===================================================================== */
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
function newId(){return uid()}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

function dayLabel(d){const k=daysTo(d);return (k===0?'النهارده':k===1?'بكره':k===-1?'امبارح':dayName(d))+' '+fd(d)}

function nSlots(){const s=S.settings;return Math.max(1,Math.floor((n(s.workEnd)-n(s.workStart))/Math.max(.5,n(s.slotHours))))}
function slotStart(i){const s=S.settings;return n(s.workStart)+i*n(s.slotHours)}
function slotLabel(i){return `من ${fmtH(slotStart(i))} لـ ${fmtH(slotStart(i)+n(S.settings.slotHours))}`}
const crews=()=>Math.max(1,parseInt(S.settings.crews)||1);
const isOff=d=>(S.settings.offDays||[]).includes(new Date(d+'T12:00:00').getDay());
function firstOpen(){
  const h=nowH();let d=today(),min=0;
  if(h>=n(S.settings.workEnd)){d=addDays(d,1)}
  else{while(min<nSlots()&&slotStart(min)<h)min++;if(min>=nSlots()){d=addDays(d,1);min=0}}
  return{d,min};
}
const slotCount=(d,k,exceptId)=>S.requests.filter(r=>r.date===d&&r.slot===k&&r.status!=='cancelled'&&r.id!==exceptId).length;
async function allocate(){
  const cap=crews();let {d,min}=firstOpen();
  for(let i=0;i<60;i++,d=addDays(d,1),min=0){
    if(isOff(d))continue;
    let slot=-1;
    if(ONLINE){
      const ref=FB.db.doc('days/'+d);
      slot=await FB.db.runTransaction(async tx=>{const s=await tx.get(ref);const data=s.exists?s.data():{};for(let k=min;k<nSlots();k++){const c=data['s'+k]||0;if(c<cap){tx.set(ref,{['s'+k]:c+1},{merge:true});return k}}return -1});
    }else{for(let k=min;k<nSlots();k++){if(slotCount(d,k)<cap){slot=k;break}}}
    if(slot>=0)return{date:d,slot};
  }
  return null;
}
function moveSlot(oldD,oldS,newD,newS){
  if(!ONLINE)return;
  const inc=(d,s,v)=>FB.db.doc('days/'+d).set({['s'+s]:firebase.firestore.FieldValue.increment(v)},{merge:true}).catch(()=>{});
  if(oldD&&oldS!=null)inc(oldD,oldS,-1);
  if(newD&&newS!=null)inc(newD,newS,1);
}

document.addEventListener('submit',async e=>{
  if(e.target.id==='setupF'){
    e.preventDefault();const btn=e.target.querySelector('button');btn.disabled=true;
    const name=$('#su_name').value.trim(),un=normD($('#su_user').value).trim().toLowerCase(),pw=normD($('#su_pass').value);
    try{
      if(!USER_RE.test(un))throw 'اسم المستخدم لازم حروف إنجليزي صغيرة أو أرقام';
      if(pw.length<6)throw 'كلمة السر 6 على الأقل';
      if(ONLINE){
        const cred=await FB.auth.createUserWithEmailAndPassword(emailOf(un),pw).catch(async er=>{if(er.code==='auth/email-already-in-use')return FB.auth.signInWithEmailAndPassword(emailOf(un),pw);throw er});
        const u=cred.user.uid;const b=FB.db.batch();
        b.set(FB.db.doc('users/'+u),{name,username:un,role:'admin',owner:true,active:true,clientId:''});
        b.set(FB.db.doc('meta/admin'),{uid:u});
        await b.commit();
        await FB.db.doc('meta/settings').set({...DEFAULT_SETTINGS,engineer:name});
        await FB.db.doc('meta/counter').set({next:1},{merge:true});
        NEEDS_SETUP=false;
        const d=await FB.db.doc('users/'+u).get();ME={...d.data(),id:u};stopListeners();startListeners();go('home');
      }else{
        const u={id:uid(),name,username:un,role:'admin',owner:true,active:true,clientId:'',hash:pwHash(un,pw)};
        S.users.push(u);S.settings.engineer=S.settings.engineer||name;save();ME=u;setSession(u.id);go('home');
      }
    }catch(er){toast(typeof er==='string'?er:fbErr(er));btn.disabled=false}
  }
  if(e.target.id==='loginF'){
    e.preventDefault();const un=normD($('#li_user').value).trim().toLowerCase(),pw=$('#li_pass').value;
    if(ONLINE){const btn=e.target.querySelector('button');btn.disabled=true;try{await FB.auth.signInWithEmailAndPassword(emailOf(un),normD(pw))}catch(er){toast(fbErr(er));btn.disabled=false}return}
    const u=S.users.find(x=>x.username===un&&x.active!==false);
    if(!u){toast('مفيش مستخدم بالاسم ده'+(S.users.length?'':'')+' — اتأكد إنك كاتبه بالإنجليزي');return}

    ME=u;setSession(u.id);go('home');
  }
});

function revenueChart(){
  const ms=Array.from({length:12},(_,i)=>addMonths(today().slice(0,7)+'-01',i-11).slice(0,7));
  const inv=Object.fromEntries(ms.map(m=>[m,0])),col=Object.fromEntries(ms.map(m=>[m,0]));
  const add=(o,d,v)=>{const k=(d||'').slice(0,7);if(k in o)o[k]+=n(v)};
  S.reports.forEach(r=>{add(inv,r.date,r.total);add(col,r.date,r.paid)});
  S.contracts.forEach(k=>{add(inv,k.start,k.value);add(col,k.start,k.paid)});
  (S.sales||[]).forEach(x=>{add(inv,x.date,x.price);add(col,x.date,x.down)});
  S.payments.forEach(p=>add(col,p.date,p.amount));
  const A=ms.map(m=>inv[m]),B=ms.map(m=>col[m]);
  const mx=Math.max(1000,...A,...B);const step=Math.pow(10,Math.floor(Math.log10(mx)));const top=Math.ceil(mx/step)*step;
  const W=760,H=250,L=56,R=16,T=16,Bm=30,iw=W-L-R,ih=H-T-Bm;
  const X=i=>L+iw*i/11,Y=v=>T+ih*(1-v/top);
  const path=a=>a.map((v,i)=>{const x=X(i),y=Y(v);if(!i)return `M${x},${y}`;const px=X(i-1),py=Y(a[i-1]),cx=(px+x)/2;return `C${cx},${py} ${cx},${y} ${x},${y}`}).join(' ');
  const area=a=>path(a)+` L${X(11)},${T+ih} L${X(0)},${T+ih} Z`;
  const fmt=v=>v>=1e6?(v/1e6).toFixed(1).replace('.0','')+'M':v>=1e3?Math.round(v/1e3)+'k':String(Math.round(v));
  const ticks=[0,.25,.5,.75,1].map(f=>top*f);
  const mlab=m=>new Date(m+'-15T12:00:00').toLocaleDateString('ar-EG',{month:'short'});
  return `<div class="panel" style="min-width:0"><div class="row between"><h3 style="margin:0">الفواتير والتحصيل آخر 12 شهر</h3><div class="legend"><span><i style="background:#22d3c5"></i>الفواتير</span><span><i style="background:#ff3cc8"></i>التحصيل</span></div></div>
  <div class="tbl-wrap" style="margin-top:8px"><svg class="chart" viewBox="0 0 ${W} ${H}" style="width:100%;min-width:520px;height:auto;direction:ltr" role="img" aria-label="رسم الفواتير والتحصيل">
   <defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22d3c5" stop-opacity=".28"/><stop offset="1" stop-color="#22d3c5" stop-opacity="0"/></linearGradient><linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff3cc8" stop-opacity=".22"/><stop offset="1" stop-color="#ff3cc8" stop-opacity="0"/></linearGradient></defs>
   ${ticks.map(v=>`<line class="grid-l" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end">${fmt(v)}</text>`).join('')}
   ${ms.map((m,i)=>`<text x="${X(i)}" y="${H-8}" text-anchor="middle">${mlab(m)}</text>`).join('')}
   <path d="${area(A)}" fill="url(#ga)"/><path d="${area(B)}" fill="url(#gb)"/>
   <path d="${path(A)}" fill="none" stroke="#22d3c5" stroke-width="2.6"/><path d="${path(B)}" fill="none" stroke="#ff3cc8" stroke-width="2.6"/>
   <circle cx="${X(11)}" cy="${Y(A[11])}" r="4.5" fill="#22d3c5"/><circle cx="${X(11)}" cy="${Y(B[11])}" r="4.5" fill="#ff3cc8"/>
  </svg></div></div>`;
}

function readParts(){return $$('#partRows .part-row').map(row=>{const v=row.querySelector('.pr-part').value;if(!v)return null;const base={price:n(row.querySelector('.pr-price').value),photo:FORM.partPhotos[row.dataset.k]||'',wMonths:n(row.querySelector('.pr-wm').value),wPulses:n(row.querySelector('.pr-wp').value)};

async function saveReport(){

  const old=FORM.id?S.reports.find(x=>x.id===FORM.id):null;
  const qp=l=>!l.unitId&&l.partId;
  const need={};parts.filter(qp).forEach(p=>need[p.partId]=(need[p.partId]||0)+p.qty);
  const back={};(old?.parts||[]).filter(qp).forEach(p=>back[p.partId]=(back[p.partId]||0)+p.qty);
  for(const pid in need){const p=part(pid);const avail=n(p.qty)+(back[pid]||0);if(need[pid]>avail){toast(`الكمية المتاحة من "${p.name}" ${avail} بس`);return}}

  const fee=n($('#f_fee').value),disc=n($('#f_disc').value),tot=n(fee+parts.reduce((a,p)=>a+p.qty*p.price,0)-disc);
  const faults=old?.faults||[];
  const r={id:rid,no,date:g('f_date'),clientId:cid,branch:$('#f_branch').disabled?'':g('f_branch'),
    device:{brand:g('f_dbrand'),name:g('f_dname'),model:g('f_dmodel'),serial:g('f_dserial')},
    tx:g('f_tx'),pp:ppNow,hv:g('f_hv'),faults,
    visitType:g('f_visit'),work:g('f_work'),complaint:g('f_complaint'),done:g('f_done'),parts,oldReceived:$('#f_old').checked,
    visitFee:fee,discount:disc,total:tot,method:g('f_method'),term:FORM.term,
    paid:FORM.term==='cash'?tot:Math.min(tot,n(g('f_paid'))),due:FORM.term==='credit'?g('f_due'):'',
    by:old?.by||ME.id,payReceived:$('#f_recv_ok').checked,payPhoto:FORM.payPhoto,requestId:old?.requestId||FORM.reqId||'',
    sentAt:old?.sentAt||'',engineer:g('f_eng'),receiver:g('f_recv'),notes:g('f_notes'),sigEng:FORM.sigEng,sigClient:FORM.sigClient,photos:FORM.photos};

function drawPhotos(){const el=$('#photos');if(!el)return;el.innerHTML=FORM.photos.length?FORM.photos.map((p,i)=>`<figure><img src="${p}" alt="صورة ${i+1}"><button type="button" class="btn sm" data-delphoto="${i}">✕</button></figure>`).join(''):'<span class="muted" style="font-size:.9rem">مفيش صور</span>'}
function compress(file,max=1000,q=.65){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}
function sigPad(key){
  const cv=$('#'+key);if(!cv)return;
  const r=cv.getBoundingClientRect();cv.width=r.width*2;cv.height=r.height*2;const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);
  if(FORM[key]){const im=new Image();im.onload=()=>x.drawImage(im,0,0,cv.width,cv.height);im.src=FORM[key]}
  let drawing=false;
  const pt=e=>{const b=cv.getBoundingClientRect();return[(e.clientX-b.left)*2,(e.clientY-b.top)*2]};
  cv.onpointerdown=e=>{drawing=true;cv.setPointerCapture(e.pointerId);x.strokeStyle='#14306b';x.lineWidth=4;x.lineCap='round';x.lineJoin='round';x.beginPath();x.moveTo(...pt(e))};
  cv.onpointermove=e=>{if(!drawing)return;x.lineTo(...pt(e));x.stroke()};
  cv.onpointerup=cv.onpointercancel=()=>{if(drawing)FORM[key]=cv.toDataURL('image/png');drawing=false};
}

let h2cLoading=null;
function loadH2C(){if(window.html2canvas)return Promise.resolve();return h2cLoading||(h2cLoading=loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'))}
async function reportBlob(r){
  const holder=document.createElement('div');holder.style.cssText='position:fixed;left:-12000px;top:0;width:794px';
  holder.innerHTML=reportHTML(r);document.body.appendChild(holder);
  const node=holder.firstElementChild;
  await Promise.all([...node.querySelectorAll('img')].map(i=>i.complete?0:new Promise(z=>{i.onload=i.onerror=z})));
  const w=794,h=node.scrollHeight;
  try{
    const xml=new XMLSerializer().serializeToString(node);
    const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><foreignObject x="0" y="0" width="${w}" height="${h}">${xml}</foreignObject></svg>`;
    const img=new Image();img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);await img.decode();
    const cv=document.createElement('canvas');cv.width=w*2;cv.height=h*2;const x=cv.getContext('2d');x.scale(2,2);x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0);
    const b=await new Promise(z=>cv.toBlob(z,'image/png'));if(!b)throw new Error('blank');return b;
  }catch(e){
    await loadH2C();const cv=await html2canvas(node,{scale:2,backgroundColor:'#ffffff'});return await new Promise(z=>cv.toBlob(z,'image/png'));
  }finally{holder.remove()}
}

/* أقساط الموردين */
function purSched(p){
  if(!p.plan)return [];const rem=n(n(p.total)-n(p.paid));if(rem<=0.009)return [];
  const c=Math.max(1,parseInt(p.plan.count)||1),ev=Math.max(1,parseInt(p.plan.every)||1),each=Math.floor(rem/c*100)/100;
  let cover=n(rem-supPurchaseBal(p));
  return Array.from({length:c},(_,i)=>{const amount=i===c-1?n(rem-each*(c-1)):each;const paid=Math.min(amount,Math.max(0,cover));cover-=amount;return{i,due:addMonths(p.plan.start,i*ev),amount,paid:n(paid),bal:n(amount-paid)}});
}

function decideHR(id,ok){

let ACP='month',ACF='',ACT='';
function acRange(){const t=today();if(ACP==='month')return[t.slice(0,7)+'-01',t];if(ACP==='last'){const s=addMonths(t.slice(0,7)+'-01',-1);return[s,addDays(t.slice(0,7)+'-01',-1)]}if(ACP==='year')return[t.slice(0,4)+'-01-01',t];if(ACP==='custom')return[ACF||'2000-01-01',ACT||t];return['2000-01-01','2999-12-31']}
function viewAccounts(){
  const [A,B]=acRange();const inR=d=>d&&d>=A&&d<=B;
  const partBuy=l=>l.unitId?n(l.cost):n(l.cost)||n(part(l.partId)?.buy);
  // الإيرادات
  const reps=S.reports.filter(r=>inR(r.date));
  const repParts=reps.reduce((a,r)=>a+r.parts.reduce((b,l)=>b+n(l.qty)*n(l.price),0),0);
  const repPartsCost=reps.reduce((a,r)=>a+r.parts.reduce((b,l)=>b+n(l.qty)*partBuy(l),0),0);
  const repVisits=reps.reduce((a,r)=>a+n(r.total),0)-repParts;
  const ks=S.contracts.filter(k=>inR(k.start)),ksV=ks.reduce((a,k)=>a+n(k.value),0);
  const sl=(S.sales||[]).filter(x=>inR(x.date)),slV=sl.reduce((a,x)=>a+n(x.price),0),slC=sl.reduce((a,x)=>a+(x.stockDeviceId?sdevCost(sdevById(x.stockDeviceId)||{}):n(x.cost)),0);
  const partnerShare=sl.reduce((a,x)=>{const d=x.stockDeviceId&&sdevById(x.stockDeviceId);const pc=d&&partnerCalc(d);return a+(pc?Math.max(0,pc.share):0)},0);
  let rentV=0;(S.rentals||[]).forEach(r=>rentSched(r).forEach(q=>{if(inR(q.due))rentV+=q.amount}));
  const ps=(S.partSales||[]).filter(x=>inR(x.date)),psV=ps.reduce((a,x)=>a+n(x.total),0),psC=ps.reduce((a,x)=>a+(x.lines||[]).reduce((b,l)=>b+n(l.qty)*partBuy(l),0),0);
  const rets=(S.partReturns||[]).filter(x=>inR(x.date)),retCredit=rets.filter(x=>x.creditMode!=='none').reduce((a,x)=>a+n(x.credit),0);
  const revenue=repVisits+repParts+ksV+slV+rentV+psV-retCredit;
  // التكاليف
  const exps=(S.custody||[]).filter(x=>x.kind==='expense'&&x.status!=='rejected'&&inR(x.date)),expV=exps.reduce((a,x)=>a+n(x.amount),0);
  const extRep=(S.units||[]).reduce((a,u)=>a+(u.repairs||[]).filter(r=>inR(r.backAt)).reduce((b,r)=>b+n(r.cost),0),0);
  const cogs=repPartsCost+slC+psC;
  const profit=revenue-cogs-expV-partnerShare;
  // الكاش
  const cashIn=reps.reduce((a,r)=>a+n(r.paid),0)+ks.reduce((a,k)=>a+n(k.paid),0)+sl.reduce((a,x)=>a+n(x.down),0)+ps.reduce((a,x)=>a+n(x.paid),0)+S.payments.filter(p=>inR(p.date)).reduce((a,p)=>a+n(p.amount),0);
  const supOut=S.purchases.filter(p=>inR(p.date)).reduce((a,p)=>a+n(p.paid),0)+S.supplierPayments.filter(p=>inR(p.date)).reduce((a,p)=>a+n(p.amount),0);
  const refunds=rets.filter(x=>x.creditMode==='refund').reduce((a,x)=>a+n(x.credit),0);
  const ptOut=(S.stockDevices||[]).reduce((a,d)=>a+((d.partner?.payouts)||[]).filter(x=>inR(x.date)).reduce((b,x)=>b+n(x.amount),0),0);
  const mktBuy=(S.stockDevices||[]).filter(d=>d.source!=='supplier'&&inR(d.buyDate)).reduce((a,d)=>a+n(d.buyPrice),0);
  const devCosts=(S.stockDevices||[]).reduce((a,d)=>a+(d.costs||[]).filter(c=>(c.type==='labor'||c.type==='other')&&inR(c.date)).reduce((b,c)=>b+n(c.amount),0),0);
  const cashGiven=(S.custody||[]).filter(x=>x.kind==='cash'&&inR(x.date)).reduce((a,x)=>a+n(x.amount),0)-(S.custody||[]).filter(x=>x.kind==='settle'&&inR(x.date)).reduce((a,x)=>a+n(x.amount),0);
  const cashOut=supOut+refunds+ptOut+mktBuy+devCosts+extRep+cashGiven;
  // الأصول والديون (دلوقتي)
  const stockV=S.parts.reduce((a,p)=>a+Math.max(0,n(p.qty))*n(p.buy),0),unitsV=(S.units||[]).filter(u=>u.status==='in_stock').reduce((a,u)=>a+unitCost(u),0);
  const devV=(S.stockDevices||[]).filter(d=>['in_stock','repairing','rented'].includes(d.status)).reduce((a,d)=>a+sdevCost(d),0);
  const custV=STAFF().reduce((a,u)=>a+Math.max(0,custOf(u.id).bal),0);
  const arNow=openItems().reduce((a,i)=>a+i.bal,0);
  const salesFuture=(S.sales||[]).reduce((a,s)=>a+saleSched(s).filter(q=>q.due>addDays(today(),30)).reduce((b,q)=>b+q.bal,0),0);
  const credits=S.reports.reduce((a,r)=>a+Math.max(0,-balOf('report',r)),0)+(S.partSales||[]).reduce((a,x)=>a+Math.max(0,-balOf('psale',x)),0);
  const supDebt=SUPS().concat(S.suppliers.filter(s=>s.deleted)).reduce((a,s)=>a+Math.max(0,supBal(s.id).bal),0);
  const ptDebt=(S.stockDevices||[]).reduce((a,d)=>a+Math.max(0,partnerCalc(d)?.owed||0),0);
  const line=(l,v,cls='')=>`<div class="stat-line ${cls}"><span>${l}</span><b class="num">${money(v)}</b></div>`;
  const topC={};reps.forEach(r=>{topC[r.clientId]=(topC[r.clientId]||0)+n(r.total)});const tc=Object.entries(topC).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const topP={};reps.forEach(r=>r.parts.forEach(l=>{topP[l.name]=(topP[l.name]||0)+n(l.qty)}));ps.forEach(x=>(x.lines||[]).forEach(l=>{topP[l.name]=(topP[l.name]||0)+n(l.qty)}));const tp=Object.entries(topP).sort((a,b)=>b[1]-a[1]).slice(0,6);
  return `<div class="row between"><h2>حسابات الشركة</h2><div class="row"><select id="acp" style="width:auto">${[['month','الشهر ده'],['last','الشهر اللي فات'],['year','السنة دي'],['all','من الأول'],['custom','فترة مخصوصة']].map(([k,l])=>`<option value="${k}" ${ACP===k?'selected':''}>${l}</option>`).join('')}</select>${ACP==='custom'?`<input type="date" id="acf" value="${ACF}" style="width:auto"><input type="date" id="act" value="${ACT}" style="width:auto">`:''}</div></div>
  <div class="muted small">الفترة من ${fd(A==='2000-01-01'?'':A)||'الأول'} لحد ${fd(B==='2999-12-31'?today():B)}. الأرقام تقريبية: تكلفة القطع محسوبة بسعر الشراء الحالي.</div>
  <div class="grid g4"><div class="panel kpi"><span>الإيرادات</span><b>${money(revenue)}</b></div><div class="panel kpi"><span>تكلفة البضاعة والمصاريف</span><b>${money(cogs+expV+partnerShare)}</b></div><div class="panel kpi"><span>صافي الربح التقريبي</span><b>${money(profit)}</b></div><div class="panel kpi"><span>الفلوس اللي دخلت</span><b>${money(cashIn)}</b></div></div>
  <div class="grid g2">
    <div class="panel"><h3>الإيرادات</h3>${line('زيارات الصيانة (من غير القطع)',repVisits)}${line('قطع غيار اتركبت في الصيانة',repParts)}${line('عقود صيانة بدأت في الفترة',ksV)}${line('بيع أجهزة',slV)}${line('إيجار أجهزة (المستحق)',rentV)}${line('بيع قطع غيار لبره',psV)}${retCredit?line('مرتجعات',-retCredit):''}${line('الإجمالي',revenue,'tot')}</div>
    <div class="panel"><h3>التكاليف والربح</h3>${line('تكلفة قطع الصيانة',repPartsCost)}${line('تكلفة الأجهزة المتباعة',slC)}${line('تكلفة قطع الغيار المتباعة',psC)}${line('مصاريف الموظفين (مواصلات وغيره)',expV)}${line('نصيب الشركاء من الربح',partnerShare)}${line('صافي الربح التقريبي',profit,'tot')}<div class="stat-line"><span class="muted small">ربح قطع الصيانة</span><span class="num small">${money(repParts-repPartsCost)}</span></div><div class="stat-line"><span class="muted small">ربح الأجهزة</span><span class="num small">${money(slV-slC)}</span></div><div class="stat-line"><span class="muted small">ربح بيع القطع</span><span class="num small">${money(psV-psC)}</span></div></div>
    <div class="panel"><h3>حركة الفلوس</h3>${line('دخل من العملاء والمشترين',cashIn,'pos')}${line('اتدفع للموردين',supOut)}${line('شراء أجهزة من السوق',mktBuy)}${line('مصنعية وتصليح بره',devCosts+extRep)}${line('صرف للشركاء',ptOut)}${line('رد فلوس مرتجعات',refunds)}${line('عهد نقدية اتسلمت للموظفين (صافي)',cashGiven)}${line('الصافي',cashIn-cashOut,'tot')}</div>
    <div class="panel"><h3>اللي عند الشركة دلوقتي</h3>${line('قيمة مخزن قطع الغيار',stockV)}${line('القطع المكوّدة في المخزن',unitsV)}${line('أجهزة الشركة (مخزن وإيجار)',devV)}${line('فلوس عهد مع الموظفين',custV)}${line('الإجمالي',stockV+unitsV+devV+custV,'tot')}</div>
    <div class="panel"><h3>ديون لينا</h3>${line('مستحق دلوقتي (متأخر وخلال شهر)',arNow)}${line('أقساط أجهزة لسه مجاش ميعادها',salesFuture)}${line('الإجمالي',arNow+salesFuture,'tot')}${can('ar')?'<div style="margin-top:8px"><button class="btn sm" data-go="ar">افتح الآجل والتحصيل</button></div>':''}</div>
    <div class="panel"><h3>ديون علينا</h3>${line('للموردين (فواتير وأقساط أجهزة)',supDebt)}${line('للشركاء في الأجهزة',ptDebt)}${line('فلوس مستحقة لعملاء (مرتجعات)',credits)}${line('الإجمالي',supDebt+ptDebt+credits,'tot')}</div>
    <div class="panel"><h3>أكتر العملاء تعامل في الفترة</h3>${tc.length?tc.map(([c,v])=>line(esc(client(c)?.name||'—'),v)).join(''):'<div class="empty">—</div>'}</div>
    <div class="panel"><h3>أكتر القطع اتباعت في الفترة</h3>${tp.length?tp.map(([nm,q])=>`<div class="stat-line"><span>${esc(nm)}</span><b>${q}</b></div>`).join(''):'<div class="empty">—</div>'}</div>
  </div>
  <div class="panel"><h3>أكتر الأعطال عند كل العملاء</h3>${faultTable('')}</div>`;
}

function viewAR(){
  const items=openItems(); const tot=items.reduce((a,i)=>a+i.bal,0);
  const late=items.filter(i=>daysTo(i.due)<0).reduce((a,i)=>a+i.bal,0);
  const pays=[...S.payments].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,40);
  const refName=p=>{const x=refOf(p.refType,p.refId);if(!x)return '—';const cn=client(x.clientId)?.name||x.buyer||'';if(p.refType==='psale')return `${cn} — فاتورة قطع #${pad(x.no)}`;if(p.refType==='report')return `${cn} — تقرير #${pad(x.no)}`;if(p.refType==='contract')return `${cn} — عقد صيانة`;if(p.refType==='sale')return `${cn} — قسط ${(+p.sub)+1} (${devName(x.device)})`;return `${cn} — إيجار ${monthName(addMonths(x.start,+p.sub))}`};

  <div class="grid g3"><div class="panel kpi"><span>إجمالي الآجل</span><b style="color:var(--accent)">${money(tot)}</b></div><div class="panel kpi"><span>متأخر عن ميعاده</span><b style="color:var(--bad)">${money(late)}</b></div><div class="panel kpi"><span>تحصيلات الشهر</span><b>${money(S.payments.filter(p=>p.date.startsWith(today().slice(0,7))).reduce((a,p)=>a+n(p.amount),0))}</b></div></div>
  <div class="panel"><h3>المستحقات المفتوحة</h3>${items.length?`<div class="tbl-wrap"><table class="t"><thead><tr><th>ميعاد التحصيل</th><th>العيادة</th><th>البيان</th><th>الإجمالي</th><th>المتبقي</th><th>الحالة</th><th></th></tr></thead><tbody>${items.map(i=>`<tr><td>${fd(i.due)}</td><td><b>${esc(cName(i.client)||'—')}</b><div class="muted num" style="font-size:.8rem">${esc(i.client?.phone||'')}</div></td><td>${i.type==='report'?`<a href="#" data-view="${i.x.id}">${esc(i.label)}</a>`:i.type==='psale'?`<a href="#" data-go="psale" data-p="${i.x.id}">${esc(i.label)}</a>`:(i.type==='sale'||i.type==='rent')?`<a href="#" data-go="dev" data-p="${i.type}:${i.x.id}">${esc(i.label)}</a>`:esc(i.label)}</td><td class="num">${money(i.total)}</td><td class="num"><b>${money(i.bal)}</b></td><td>${dueBadge(i.due)}</td><td><div class="row" style="flex-wrap:nowrap"><button class="btn sm pri" data-act="collect" data-type="${i.type}" data-id="${i.x.id}" data-sub="${i.sub??''}">تحصيل</button>${i.type==='report'||i.type==='contract'?`<button class="btn sm ghost" data-act="redue" data-type="${i.type}" data-id="${i.x.id}">تأجيل</button>`:''}${(i.client?.phone||i.x.phone)?`<button class="btn sm ghost" data-act="waRemind" data-type="${i.type}" data-id="${i.x.id}" data-sub="${i.sub??''}" title="تذكير العميل على الواتساب">واتساب</button>`:''}</div></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">مفيش مستحقات آجلة</div>'}</div>
  <div class="panel"><h3>آخر التحصيلات</h3>${pays.length?`<div class="tbl-wrap"><table class="t"><thead><tr><th>التاريخ</th><th>البيان</th><th>الطريقة</th><th>استلمها</th><th>المبلغ</th><th></th></tr></thead><tbody>${pays.map(p=>`<tr><td>${fd(p.date)}</td><td>${esc(refName(p))}</td><td>${esc(p.method)}</td><td>${esc(userName(p.by)||(p.lump?'حساب الشركة':'—'))}</td><td class="num">${money(p.amount)}</td><td><div class="row" style="flex-wrap:nowrap">${p.receipt?`<button class="btn sm" data-act="showImg" data-src="p:${p.id}">الإيصال</button>`:''}${can('delete')?`<button class="btn sm ghost" data-act="delPay" data-id="${p.id}">حذف</button>`:''}</div></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">لسه مفيش تحصيلات</div>'}</div>`;

function openCollect(type,id,sub){
  const x=refOf(type,id);const bal=itemBal(type,x,sub);const sched=type==='sale'||type==='rent';
  let receipt='';
  modal(`<h3>تسجيل تحصيل</h3><div class="muted">${esc(client(x.clientId)?.name||x.buyer||'')} — المتبقي ${money(bal)}</div><div class="grid g2">
   <label class="f">المبلغ<input type="number" min="0" step="any" id="pa_a" value="${bal}"></label>
   <label class="f">التاريخ<input type="date" id="pa_d" value="${today()}"></label>
   <label class="f">الطريقة<select id="pa_m">${S.settings.methods.map(m=>`<option>${esc(m)}</option>`).join('')}</select></label>
   ${sched?'':`<label class="f">ميعاد تحصيل الباقي (لو جزئي)<input type="date" id="pa_due" value="${addDays(today(),30)}"></label>`}</div>
   <div class="row"><div class="photos" id="pa_box"></div><label class="btn">📷 صوّر الإيصال<input type="file" id="pa_photo" accept="image/*" capture="environment" hidden></label></div>
   <label class="row" style="gap:6px"><input type="checkbox" id="pa_ok" style="width:auto"> <b>أقر إني (${esc(ME.name)}) استلمت المبلغ ده</b></label>`,()=>{
    const a=Math.min(bal,n($('#pa_a').value));if(a<=0){toast('اكتب المبلغ');return false}
    if(!$('#pa_ok').checked){toast('علّم على إنك استلمت المبلغ');return false}
    const pay={id:uid(),refType:type,refId:id,clientId:x.clientId,date:$('#pa_d').value,amount:a,method:$('#pa_m').value,by:ME.id,receipt};if(sched)pay.sub=+sub;S.payments.push(pay);
    if(!sched&&bal-a>0.009)x.due=$('#pa_due').value;
    save();toast('اتسجل التحصيل');render();
  });
  $('#pa_photo').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{receipt=await compress(f,900,.6);$('#pa_box').innerHTML=`<figure><img src="${receipt}" alt="الإيصال"></figure>`;$('#pa_ok').checked=true}catch(_){toast('معرفتش أقرا الصورة')}};
}
function openRedue(type,id){
  const x=type==='report'?S.reports.find(r=>r.id===id):S.contracts.find(k=>k.id===id);
  modal(`<h3>تغيير ميعاد التحصيل</h3><label class="f">الميعاد الجديد<input type="date" id="rd_d" value="${x.due||today()}"></label>`,()=>{x.due=$('#rd_d').value;save();render()});
}
function showImg(src){
  const [t,id,i]=src.split(':');let d='';
  if(t==='r')d=S.reports.find(x=>x.id===id)?.payPhoto;
  else if(t==='p')d=S.payments.find(x=>x.id===id)?.receipt;
  else if(t==='q')d=S.requests.find(x=>x.id===id)?.photos?.[+i];
  else if(t==='pu')d=S.purchases.find(x=>x.id===id)?.photo;
  else if(t==='sp')d=S.supplierPayments.find(x=>x.id===id)?.photo;
  else if(t==='cu')d=(S.custody||[]).find(x=>x.id===id)?.photo;
  if(!d)return;closeModal();
  const bg=document.createElement('div');bg.className='modal-bg';bg.id='modal';
  bg.innerHTML=`<div class="modal"><img src="${d}" alt="صورة" style="width:100%;border-radius:8px"><div class="row" style="justify-content:flex-end"><button class="btn" id="imgClose">إغلاق</button></div></div>`;
  document.body.appendChild(bg);$('#imgClose').onclick=closeModal;bg.onclick=e=>{if(e.target===bg)closeModal()};
}

const RULES=`rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    function signed() { return request.auth != null; }
    function hasUser() { return signed() && exists(/databases/$(database)/documents/users/$(request.auth.uid)); }
    function me() { return get(/databases/$(database)/documents/users/$(request.auth.uid)).data; }
    function active() { return hasUser() && me().get('active', true) != false; }
    function isAdmin() { return active() && (me().get('owner', false) == true || (me().role == 'admin' && !('perms' in me()))); }
    function notOwnerDoc() { return resource.data.get('owner', false) != true && request.resource.data.get('owner', false) != true; }
    function isStaff() { return active() && me().role in ['admin', 'exec', 'manager', 'engineer', 'accountant', 'cons_staff', 'courier', 'staff']; }
    function can(p) { return isAdmin() || (isStaff() && me().get('perms', {}).get(p, false) == true); }
    function ownClient() { return active() && me().role == 'clinic' && resource.data.clientId == me().clientId; }
    function mineDoc() { return isStaff() && resource.data.uid == request.auth.uid; }
    function approver() { return isStaff() && request.auth.uid in resource.data.approvers; }

    match /meta/admin { allow read: if true; allow create: if signed() && !exists(/databases/$(database)/documents/meta/admin); }
    match /meta/settings { allow read: if signed(); allow write: if can('settings'); }
    match /meta/counter { allow read, write: if isStaff(); }
    match /days/{d} { allow read, write: if signed(); }

    match /users/{uid} {
      allow read: if signed() && (request.auth.uid == uid || isStaff());
      allow create: if (can('users') && request.resource.data.get('owner', false) != true) || (request.auth.uid == uid && request.resource.data.role == 'admin' && !exists(/databases/$(database)/documents/meta/admin));
      allow update: if (can('users') && notOwnerDoc()) || (request.auth.uid == uid && isAdmin()) || (can('leave_bal') && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['leaveBal']));
      allow delete: if can('users') && resource.data.get('owner', false) != true && request.auth.uid != uid;
    }
    match /clients/{id} {
      allow read: if isStaff() || (hasUser() && me().clientId == id);
      allow create, update: if isStaff();
      allow delete: if can('clients_delete');
    }
    match /parts/{id} { allow read, create, update: if isStaff(); allow delete: if can('stock_edit'); }
    match /units/{id} { allow read, create, update: if isStaff(); allow delete: if can('stock_edit'); }
    match /returns/{id} { allow read, write: if isStaff(); }
    match /reports/{id} { allow read: if isStaff() || ownClient(); allow create, update: if isStaff(); allow delete: if can('delete'); }
    match /contractReqs/{id} {
      allow read: if can('contracts') || can('clients') || ownClient();
      allow create: if active() && me().role == 'clinic' && request.resource.data.clientId == me().clientId && request.resource.data.status == 'new';
      allow update: if can('contracts') || (ownClient() && resource.data.status == 'new' && request.resource.data.status == 'cancelled');
      allow delete: if can('contracts');
    }
    match /contracts/{id} { allow read: if isStaff() || ownClient(); allow create, update: if isStaff(); allow delete: if can('delete'); }
    match /payments/{id} { allow read: if isStaff() || ownClient(); allow create, update: if isStaff(); allow delete: if can('delete'); }
    match /partReturns/{id} { allow read: if isStaff() || ownClient(); allow write: if can('returns'); }
    match /requests/{id} {
      allow read: if isStaff() || (signed() && resource.data.uid == request.auth.uid);
      allow create: if isStaff() || (hasUser() && request.resource.data.uid == request.auth.uid && request.resource.data.clientId == me().clientId);
      allow update: if isStaff();
      allow delete: if can('requests');
    }
    match /suppliers/{id} { allow read: if can('suppliers') || can('accounts') || can('devices'); allow create, update: if can('suppliers'); allow delete: if can('suppliers_delete'); }
    match /purchases/{id} { allow read: if can('suppliers') || can('accounts') || can('devices'); allow write: if can('suppliers') || can('devices'); }
    match /supplierPayments/{id} { allow read: if can('suppliers') || can('accounts'); allow write: if can('suppliers'); }
    match /sales/{id} { allow read: if can('devices') || can('ar') || can('accounts') || ownClient(); allow write: if can('devices'); }
    match /rentals/{id} { allow read: if can('devices') || can('ar') || can('accounts') || ownClient(); allow write: if can('devices'); }
    match /stockDevices/{id} { allow read: if can('devices') || can('accounts'); allow write: if can('devices'); }
    match /partSales/{id} { allow read: if can('part_sales') || can('cons_sales') || can('ar') || can('accounts') || can('orders_manage') || can('orders_work') || ownClient(); allow write: if can('part_sales') || can('cons_sales') || can('orders_manage') || can('orders_work'); }
    match /offers/{id} { allow read: if active(); allow write: if can('offers'); }
    match /meetings/{id} { allow read: if isStaff(); allow create, delete: if can('meetings'); allow update: if can('meetings') || (isStaff() && request.auth.uid in resource.data.attendees); }
    match /catalog/{id} { allow read: if active(); allow write: if isStaff(); }
    match /orders/{id} {
      allow read: if can('orders_manage') || can('orders_work') || can('ar') || can('accounts') || ownClient();
      allow create: if can('orders_manage') || (active() && me().role == 'clinic' && request.resource.data.clientId == me().clientId && request.resource.data.status == 'new' && get(/databases/$(database)/documents/clients/$(me().clientId)).data.get('shop', false) == true);
      allow update: if can('orders_manage') || can('orders_work') || (ownClient() && resource.data.status == 'new' && request.resource.data.status == 'cancelled');
      allow delete: if can('orders_manage');
    }
    match /notifs/{id} { allow read: if isStaff(); allow create: if active(); allow update, delete: if can('users'); }
    match /ratings/{id} {
      allow read: if can('evals') || (isStaff() && resource.data.engineerId == request.auth.uid) || ownClient();
      allow create: if active() && me().role == 'clinic' && request.resource.data.clientId == me().clientId;
      allow update, delete: if can('evals');
    }
    match /punches/{id} { allow read: if can('hr') || can('payroll_prep') || can('payroll_approve') || mineDoc(); allow create: if isStaff() && request.resource.data.uid == request.auth.uid; allow update, delete: if can('hr'); }
    match /tests/{id} { allow read: if isStaff(); allow write: if can('tests'); }
    match /testKeys/{id} { allow read, write: if can('tests'); }
    match /testAnswers/{id} {
      allow read: if can('tests') || mineDoc();
      allow create: if isStaff() && request.resource.data.uid == request.auth.uid && request.resource.data.status == 'submitted';
      allow update, delete: if can('tests');
    }
    match /empFiles/{id} { allow read: if can('emp_files') || mineDoc(); allow write: if can('emp_files'); }
    match /empDocs/{id} { allow read: if can('emp_files') || mineDoc(); allow write: if can('emp_files'); }
    match /attendance/{id} { allow read: if can('attendance') || can('payroll_prep') || can('payroll_approve'); allow write: if can('attendance'); }
    match /salaries/{id} { allow read: if can('salary_set') || can('payroll_prep') || can('payroll_approve'); allow write: if can('salary_set'); }
    match /payroll/{id} { allow read: if can('payroll_prep') || can('payroll_approve'); allow create, update: if can('payroll_prep') || can('payroll_approve'); allow delete: if can('payroll_approve'); }
    match /payslips/{id} { allow read: if can('payroll_approve') || mineDoc(); allow write: if can('payroll_approve'); }
    match /bonuses/{id} {
      allow read: if can('bonuses') || can('bonuses_approve') || can('payroll_prep') || can('payroll_approve') || approver() || (isStaff() && resource.data.uid == request.auth.uid && resource.data.status == 'approved');
      allow create: if can('bonuses_approve') || (can('bonuses') && request.resource.data.status == 'pending' && request.resource.data.by == request.auth.uid);
      allow update: if can('bonuses_approve') || approver();
      allow delete: if can('bonuses_approve') || (can('bonuses') && resource.data.status == 'pending' && resource.data.by == request.auth.uid);
    }
    match /evals/{id} { allow read: if can('evals') || mineDoc(); allow write: if can('evals'); }
    match /penalties/{id} {
      allow read: if can('penalties') || can('penalties_approve') || can('payroll_prep') || can('payroll_approve') || approver() || (isStaff() && resource.data.uid == request.auth.uid && resource.data.status == 'approved');
      allow create: if can('penalties_approve') || (can('penalties') && request.resource.data.status == 'pending' && request.resource.data.by == request.auth.uid);
      allow update: if can('penalties_approve') || approver();
      allow delete: if can('penalties_approve') || (can('penalties') && resource.data.status == 'pending' && resource.data.by == request.auth.uid);
    }
    match /custody/{id} {
      allow read: if can('custody') || can('accounts') || mineDoc() || approver();
      allow create: if can('custody') || (isStaff() && request.resource.data.uid == request.auth.uid && request.resource.data.kind == 'expense' && request.resource.data.status == 'pending');
      allow update: if can('custody') || approver();
      allow delete: if can('custody') || (mineDoc() && resource.data.kind == 'expense' && resource.data.status == 'pending');
    }
    match /hr/{id} {
      allow read: if can('hr') || can('payroll_prep') || can('payroll_approve') || can('loans') || can('custody') || mineDoc() || approver();
      allow create: if (isStaff() && request.resource.data.uid == request.auth.uid && request.resource.data.status == 'pending') || can('assign') || can('hr');
      allow update: if can('hr') || can('loans') || can('custody') || approver();
      allow delete: if can('hr') || (mineDoc() && resource.data.status == 'pending');
    }
  }
}
`;

function bindSettings(){

      workStart:ws,workEnd:we,slotHours:Math.max(.5,n($('#s_sh').value)||2),crews:Math.max(1,parseInt($('#s_crews').value)||1),offDays:$$('.s_off').filter(x=>x.checked).map(x=>+x.value),
      methods:$('#s_methods').value.split('\n').map(x=>x.trim()).filter(Boolean),terms:$('#s_terms').value.split('\n').map(x=>x.trim()).filter(Boolean)});
    const no=Math.max(1,parseInt($('#s_no').value)||1);
    if(ONLINE)FB.db.doc('meta/counter').set({next:no},{merge:true}).catch(er=>toast(fbErr(er)));else s.nextNo=no;

  if(L.demo){toast('البيانات اللي على الجهاز تجريبية — امسحها الأول أو ابدأ على نضيف');return}

  const ops=[];ALL_COLS.filter(c=>c!=='users').forEach(c=>(L[c]||[]).forEach(x=>{x=JSON.parse(JSON.stringify(x));if(c==='reports')(x.parts||[]).forEach(q=>delete q.cost);if(c==='payments'&&!x.clientId){const ref=(x.refType==='report'?L.reports:L.contracts||[]).find(y=>y.id===x.refId);x.clientId=ref?.clientId||''}ops.push([c,x])}));

function nextCode(cat){const pre=CAT_PREFIX[cat]||'SP';let mx=0;S.parts.forEach(p=>{const m=String(p.code||'').match(CODE_RE);if(m&&m[1]===pre)mx=Math.max(mx,+m[2])});return pre+'-'+pad(mx+1)}

function syncCatalog(){

}

async function sendOrder(){
  const L=cartLines();if(!L.length){toast('اختار منتج الأول');return}
  const d=$('#or_d').value;if(!d||d<today()){toast('اختار يوم التوصيل');return}
  const o={id:uid(),clientId:ME.clientId,uid:ME.id,branch:$('#or_b')?.value||'',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),lines:L,total:n(L.reduce((a,l)=>a+l.qty*l.price,0)),wantDate:d,wantTime:$('#or_t').value,notes:$('#or_n').value.trim(),status:'new',assignedTo:'',assignedName:'',log:[{st:'new',at:new Date().toISOString(),by:ME.name}]};
  const c=client(ME.clientId)||{};
  if(ONLINE){try{await FB.db.collection('orders').doc(o.id).set(o)}catch(e){toast('الطلب متبعتش: '+fbErr(e));return}}else{S.orders.push(o)}
  notify(['perm:orders_manage'],'طلب مستهلكات جديد',`${c.clinic||c.name||''} — ${orderSum(o)}`,'orders');
  if(!ONLINE)save();
  CART={};toast('اتبعت طلبك ✓');render();window.scrollTo(0,document.body.scrollHeight);
}
async function cancelMyOrder(id){const o=(S.orders||[]).find(x=>x.id===id);if(!o||o.status!=='new')return;
  if(ONLINE){try{await FB.db.doc('orders/'+id).update({status:'cancelled',updatedAt:new Date().toISOString()})}catch(e){toast(fbErr(e))}}else{o.status='cancelled';o.updatedAt=new Date().toISOString();save()}

async function assignOrder(id,u){
  const o=S.orders.find(x=>x.id===id);if(!o)return;
  if(!o.no){try{o.no=await takeCounter('order')}catch(e){}}
  o.assignedTo=u?.id||'';o.assignedName=u?.name||'';o.status=u?(o.status==='new'?'assigned':o.status):'new';o.updatedAt=new Date().toISOString();(o.log=o.log||[]).push({st:o.status,at:o.updatedAt,by:ME.name,to:u?.name||''});
  if(u)notify([u.id],'اتفوّض لك طلب مستهلكات',`${client(o.clientId)?.clinic||client(o.clientId)?.name||''} — يوصل ${fd(o.wantDate)} — ${orderSum(o)}`,'orders');
  save();toast(u?`اتفوّض لـ ${u.name}`:'اتشال الموظف');render();
}
function setOrderSt(id,st){const o=S.orders.find(x=>x.id===id);if(!o)return;o.status=st;o.updatedAt=new Date().toISOString();(o.log=o.log||[]).push({st,at:o.updatedAt,by:ME.name});save();toast(ORD_ST[st][0]);render()}

const EVAL_C=[['quality','جودة الشغل'],['time','الالتزام بالمواعيد'],['commit','الانضباط والالتزام'],['clients','التعامل مع العملاء'],['team','التعاون مع الفريق']];
const starsTxt=v=>{const k=Math.round(n(v));return `<span class="stars-t" title="${n(v).toFixed(1)}">${'★'.repeat(k)}${'☆'.repeat(Math.max(0,5-k))}</span>`};
const avg=a=>a.length?a.reduce((x,y)=>x+n(y),0)/a.length:0;
function unratedReports(){const done=new Set((S.ratings||[]).map(x=>x.reportId));return S.reports.filter(r=>r.clientId===ME?.clientId&&!done.has(r.id)&&daysTo(r.date)>=-45).sort((a,b)=>b.date.localeCompare(a.date))}
function starPicker(k,label){return `<div class="grid" style="gap:4px"><span class="muted small">${label}</span><div class="stars" data-k="${k}">${[1,2,3,4,5].map(i=>`<button type="button" data-v="${i}">★</button>`).join('')}</div></div>`}
function bindStars(root){const val={};root.querySelectorAll('.stars').forEach(s=>{const k=s.dataset.k;s.onclick=e=>{const b=e.target.closest('[data-v]');if(!b)return;val[k]=+b.dataset.v;s.querySelectorAll('button').forEach(x=>x.classList.toggle('on',+x.dataset.v<=val[k]))}});return val}

let PFY=today().slice(0,4);
const EMPS=()=>S.users.filter(u=>STAFF_ROLES.includes(u.role)&&!u.owner&&u.active!==false);
function perfOf(u,yr){
  const reps=S.reports.filter(r=>r.by===u.id&&r.date.startsWith(yr));
  const rt=(S.ratings||[]).filter(x=>x.engineerId===u.id&&(x.date||x.createdAt||'').startsWith(yr));
  const ev=(S.evals||[]).filter(x=>x.uid===u.id&&(x.date||'').startsWith(yr)).sort((a,b)=>b.date.localeCompare(a.date));
  const pen=(S.penalties||[]).filter(x=>x.uid===u.id&&x.status==='approved'&&(x.date||'').startsWith(yr));
  const tst=(S.testAnswers||[]).filter(a=>a.uid===u.id&&a.status==='graded'&&(a.gradedAt||'').startsWith(yr));
  return{reps,rt,ev,pen,tst,tAvg:avg(tst.map(a=>a.pct)),eng:avg(rt.map(x=>x.eng)),svc:avg(rt.map(x=>x.service)),evAvg:avg(ev.map(x=>x.avg))};
}

  return `<div class="row between"><h2>الأداء والتقييم</h2><select id="pfy" style="width:auto">${yrs.map(y=>`<option ${y===PFY?'selected':''}>${y}</option>`).join('')}</select></div>

    const nx=attachChain(x,'loan',ME.id);S.hr.push(x);notify(nx.length?nx:['perm:loans'],'طلب سلفة جديد',`${ME.name} — ${money(a)} على ${m} شهر`,'hr');save();toast('اتبعت طلب السلفة');render();
  });
  const f=()=>{const a=n($('#ln_a').value),m=Math.max(1,n($('#ln_m').value));$('#ln_i').value=a>0?money(a/m):''};$('#ln_a').oninput=f;$('#ln_m').oninput=f;
}
function openCustReq(){
  modal(`<h3>طلب عهدة فلوس</h3><div class="grid g2"><label class="f">المبلغ<input type="number" min="1" step="any" id="cr_a"></label><label class="f">محتاجها إمتى<input type="date" id="cr_d" value="${today()}"></label>
   <label class="f span2">الغرض من العهدة<input id="cr_p" placeholder="مثلاً: مواصلات مأمورية أسيوط، شراء خامات…"></label></div>`,()=>{
    const a=n($('#cr_a').value);if(a<=0){toast('اكتب المبلغ');return false}if(!$('#cr_p').value.trim()){toast('اكتب الغرض');return false}
    const x={id:uid(),uid:ME.id,name:ME.name,kind:'custreq',amount:a,from:$('#cr_d').value,purpose:$('#cr_p').value.trim(),status:'pending',createdAt:new Date().toISOString()};
    const nx=attachChain(x,'custreq',ME.id);S.hr.push(x);notify(nx.length?nx:['perm:custody'],'طلب عهدة جديد',`${ME.name} — ${money(a)}: ${x.purpose}`,'hr');save();toast('اتبعت طلب العهدة');render();
  });
}
function openLatePerm(){
  const c=attCfg();
  modal(`<h3>إذن تأخير / انصراف</h3><div class="grid g2"><label class="f span2">نوع الإذن<select id="lp_t">${Object.entries(LP_T).map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}</select></label>
   <label class="f">اليوم<input type="date" id="lp_d" value="${today()}"></label><label class="f"><span id="lp_tl">هوصل الساعة</span><input type="time" id="lp_h"></label>
   <label class="f span2">السبب<input id="lp_r"></label></div><div class="muted small">مواعيد الشغل: من ${esc(c.start)} لـ ${esc(c.end)}. لو الإذن اتوافق عليه، التأخير أو الانصراف بدري في اليوم ده مش هيتخصم.</div>`,()=>{
    const d=$('#lp_d').value;if(!d){toast('اختار اليوم');return false}if(!$('#lp_r').value.trim()){toast('اكتب السبب');return false}
    const x={id:uid(),uid:ME.id,name:ME.name,kind:'lateperm',type:$('#lp_t').value,date:d,from:d,time:$('#lp_h').value,reason:$('#lp_r').value.trim(),status:'pending',createdAt:new Date().toISOString()};
    const nx=attachChain(x,'lateperm',ME.id);S.hr.push(x);notify(nx.length?nx:['perm:hr'],'طلب إذن جديد',`${ME.name} — ${LP_T[x.type]} ${fd(d)}`,'hr');save();toast('اتبعت الإذن');render();
  });
  $('#lp_t').onchange=()=>{$('#lp_tl').textContent=$('#lp_t').value==='late'?'هوصل الساعة':'همشي الساعة'};
}
function latePermOf(uidv,d){return (S.hr||[]).filter(x=>x.uid===uidv&&x.kind==='lateperm'&&x.status==='approved'&&x.date===d)}
/* بعد الموافقة النهائية */
function afterHrFinal(x,fin){
  if(!fin)return;
  if(x.kind==='loan')notify(['perm:payroll_prep','perm:loans'],'سلفة اتوافق عليها',`${x.name} — ${money(x.amount)} على ${x.months} شهر من ${monthName(x.startMonth+'-01')} — اصرفها، والأقساط هتتخصم من المرتب لوحدها`,'payroll');
  if(x.kind==='custreq')notify(['perm:custody'],'طلب عهدة اتوافق عليه — سلّمها',`${x.name} — ${money(x.amount)}: ${x.purpose||''}`,'custody');
}
function deliverCustReq(id){
  const x=(S.hr||[]).find(y=>y.id===id);if(!x)return;
  modal(`<h3>تسليم عهدة — ${esc(x.name||userName(x.uid))}</h3><div class="small">${esc(x.purpose||'')}</div><div class="grid g2"><label class="f">المبلغ<input type="number" min="0" step="any" id="dc_a" value="${n(x.amount)}"></label><label class="f">التاريخ<input type="date" id="dc_d" value="${today()}"></label><label class="f">الطريقة<select id="dc_m">${S.settings.methods.map(m=>`<option>${esc(m)}</option>`).join('')}</select></label></div>`,()=>{
    const a=n($('#dc_a').value);if(a<=0)return false;
    S.custody.push({id:newId(),uid:x.uid,kind:'cash',date:$('#dc_d').value,amount:a,method:$('#dc_m').value,notes:'طلب عهدة: '+(x.purpose||''),reqId:x.id,by:ME.id,createdAt:new Date().toISOString()});
    x.delivered=true;x.deliveredAt=$('#dc_d').value;x.deliveredBy=ME.id;notify([x.uid],'استلمت العهدة',`${money(a)} — ${x.purpose||''}`,'custody');save();toast('اتسلمت العهدة');render();
  });
}
function custReqPanel(){
  if(!can('custody'))return '';const L=(S.hr||[]).filter(x=>x.kind==='custreq'&&x.status==='approved'&&!x.delivered);
  return L.length?`<div class="panel"><h3>طلبات عهدة متوافق عليها مستنية التسليم</h3>${L.map(x=>`<div class="row between" style="padding:6px 0;border-bottom:1px solid var(--line)"><span><b>${esc(x.name||userName(x.uid))}</b> — ${money(x.amount)} — ${esc(x.purpose||'')} <span class="muted small">(محتاجها ${fd(x.from)})</span></span><button class="btn sm pri" data-act="crDeliver" data-id="${x.id}">سلّم العهدة</button></div>`).join('')}</div>`:'';
}
function viewLoans(){
  const L=(S.hr||[]).filter(x=>x.kind==='loan').sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
  const act=L.filter(x=>x.status==='approved'&&loanInfo(x).left>0.009);
  return `<div class="grid g3"><div class="panel kpi"><span>سلف شغالة</span><b>${act.length}</b></div><div class="panel kpi"><span>الباقي على الموظفين</span><b>${money(act.reduce((a,x)=>a+loanInfo(x).left,0))}</b></div><div class="panel kpi"><span>أقساط الشهر ده</span><b>${money(act.reduce((a,x)=>a+loanInst(x,today().slice(0,7)),0))}</b></div></div>
  <div class="panel">${L.length?L.map(x=>hrRow(x,true)).join(''):'<div class="empty">مفيش سلف</div>'}</div><div class="muted small">قسط السلفة بيتخصم لوحده من مرتب كل شهر لحد ما تخلص.</div>`;
}
/* طلبات عقود الصيانة من العيادات */
const CR_ST={new:['جديد','p-warn'],done:['اتعمل العقد','p-ok'],rejected:['اترفض','p-bad'],cancelled:['اتلغى','p-mut']};
function clinicContractPanel(){
  const c=client(ME.clientId)||{};const k=activeContract(c.id);const mine=(S.contractReqs||[]).sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));const pend=mine.find(x=>x.status==='new');
  const last=S.contracts.filter(k=>k.clientId===ME.clientId).sort((a,b)=>(b.end||'').localeCompare(a.end||''))[0];
  return `${cp('contract')?`<div class="row" style="margin-top:8px">${pend?'<span class="pill p-warn">طلبك متبعت ومستني رد الشركة</span>':`<button class="btn pri sm" data-act="clCtReq" data-k="${last?'renew':'new'}">${last?'طلب تجديد عقد الصيانة':'طلب عمل عقد صيانة'}</button>${last?'<button class="btn sm" data-act="clCtReq" data-k="new">طلب عقد جديد (فرع تاني)</button>':''}`}</div>`:''}
   ${mine.length?`<div class="sec-title" style="margin-top:8px">طلباتك</div>${mine.slice(0,5).map(x=>`<div class="row between small" style="padding:4px 0;border-bottom:1px solid var(--line)"><span>${x.kind==='renew'?'تجديد':'عقد جديد'}${x.branch?' — '+esc(x.branch):''} — ${fd((x.createdAt||'').slice(0,10))}${x.reply?` <span class="muted">· ${esc(x.reply)}</span>`:''}</span><span class="row"><span class="pill ${CR_ST[x.status]?.[1]||'p-mut'}">${CR_ST[x.status]?.[0]||''}</span>${x.status==='new'?`<button class="btn sm ghost" data-act="clCtCancel" data-id="${x.id}">إلغاء</button>`:''}</span></div>`).join('')}`:''}`;
}
function openClinicCtReq(kind){
  const c=client(ME.clientId)||{};const br=branchesOf(c);
  modal(`<h3>${kind==='renew'?'طلب تجديد عقد الصيانة':'طلب عمل عقد صيانة'}</h3><div class="grid g2">${br.length?`<label class="f">الفرع<select id="ct_b"><option value="">كل الفروع</option>${br.map(b=>`<option>${esc(b.name)}</option>`).join('')}</select></label>`:''}<label class="f">تحب يبدأ من<input type="date" id="ct_s" value="${today()}"></label>
   <label class="f span2">عدد الأجهزة أو أي تفاصيل<textarea id="ct_n" style="min-height:70px" placeholder="مثلاً: عايزين العقد يشمل جهازين، وعدد زيارات أكتر…"></textarea></label></div>`,async()=>{
    const x={id:uid(),uid:ME.id,clientId:ME.clientId,clientName:cName(c)||c.name||'',kind,branch:$('#ct_b')?.value||'',start:$('#ct_s').value,notes:$('#ct_n').value.trim(),status:'new',createdAt:new Date().toISOString()};
    if(ONLINE){try{await FB.db.collection('contractReqs').doc(x.id).set(x)}catch(e){toast('الطلب متبعتش: '+fbErr(e));return}}else{S.contractReqs.push(x);save()}
    notify(['perm:contracts'],kind==='renew'?'طلب تجديد عقد صيانة':'طلب عقد صيانة جديد',`${x.clientName}${x.branch?' – '+x.branch:''}${x.notes?': '+x.notes:''}`,'contracts');toast('اتبعت الطلب — هنكلمك قريب');render();
  });
}
function contractReqsPanel(){
  const L=(S.contractReqs||[]).filter(x=>x.status==='new').sort((a,b)=>(a.createdAt||'').localeCompare(b.createdAt||''));
  return L.length?`<div class="panel" style="border-color:var(--accent)"><h3>طلبات عقود من العيادات (${L.length})</h3>${L.map(x=>`<div class="row between" style="padding:8px 0;border-bottom:1px solid var(--line)"><span><b>${x.kind==='renew'?'تجديد عقد':'عقد جديد'}</b> — <a href="#" data-go="client" data-p="${x.clientId}">${esc(cName(client(x.clientId))||x.clientName||'')}</a>${x.branch?' – '+esc(x.branch):''} <span class="muted small">· يبدأ ${fd(x.start)} · اتبعت ${fdt(x.createdAt)}</span>${x.notes?`<div class="small">${esc(x.notes)}</div>`:''}</span><span class="row"><button class="btn sm pri" data-act="ctReqDo" data-id="${x.id}">اعمل العقد</button><button class="btn sm danger" data-act="ctReqNo" data-id="${x.id}">رفض</button></span></div>`).join('')}</div>`:'';
}
function ctReqDo(id){
  const x=S.contractReqs.find(y=>y.id===id);if(!x)return;
  const last=S.contracts.filter(k=>k.clientId===x.clientId&&(!x.branch||(k.branch||'')===x.branch)).sort((a,b)=>(b.end||'').localeCompare(a.end||''))[0];
  const before=S.contracts.length;
  if(x.kind==='renew'&&last)openContractModal(x.clientId,last.id,true);else openContractModal(x.clientId);
  $('#modalForm').addEventListener('submit',()=>setTimeout(()=>{if(S.contracts.length>before){x.status='done';x.doneAt=new Date().toISOString();x.by=ME.id;x.contractId=S.contracts[S.contracts.length-1].id;notify([x.uid],'عقد الصيانة اتعمل ✓',`${x.kind==='renew'?'تجديد العقد':'العقد'} اتسجل — تقدر تشوفه في "حسابي"`,'contracts');save();render()}},60));
}
function ctReqNo(id){
  const x=S.contractReqs.find(y=>y.id===id);if(!x)return;
  modal(`<h3>رفض طلب العقد</h3><label class="f">رد على العيادة (اختياري)<input id="cq_r"></label>`,()=>{x.status='rejected';x.reply=$('#cq_r').value.trim();x.by=ME.id;notify([x.uid],'طلب العقد اترفض',x.reply||'كلمنا للتفاصيل','contracts');save();render()});
}
Object.assign(X9,{
  hrLoan:()=>openLoanReq(),hrCust:()=>openCustReq(),hrLate:()=>openLatePerm(),crDeliver:(t,id)=>deliverCustReq(id),
  clCtReq:(t)=>openClinicCtReq(t.dataset.k),
  clCtCancel:(t,id)=>{const x=(S.contractReqs||[]).find(y=>y.id===id);if(!x)return;confirmBox('تلغي الطلب؟',async()=>{if(ONLINE){try{await FB.db.collection('contractReqs').doc(id).update({status:'cancelled'})}catch(e){toast(fbErr(e))}}else{x.status='cancelled';save()}render()})},
  ctReqDo:(t,id)=>ctReqDo(id),ctReqNo:(t,id)=>ctReqNo(id)
});
Object.assign(NEED9,{crDeliver:'custody',ctReqDo:'contracts',ctReqNo:'contracts'});

/* دفعة على حساب العميل — بتتوزع على أقدم المستحقات */
function openClientPay(cid){
  const c=client(cid);const items=openItems(cid);const debt=n(items.reduce((a,i)=>a+i.bal,0));
  if(debt<=0.009){toast('العميل ده مفيش عليه مديونية');return}
  let receipt='';
  modal(`<h3>تسجيل دفعة على حساب ${esc(cName(c))}</h3><div class="muted">المديونية الحالية <b class="num">${money(debt)}</b> — الدفعة بتتخصم من أقدم المستحقات الأول.</div><div class="grid g2">
   <label class="f">المبلغ<input type="number" min="0" step="any" id="cp_a"></label><label class="f">التاريخ<input type="date" id="cp_d" value="${today()}"></label>
   <label class="f">الطريقة<select id="cp_m">${S.settings.methods.map(m=>`<option>${esc(m)}</option>`).join('')}</select></label>
   <label class="f">مين استلمها<select id="cp_by"><option value="">محدش — دخلت حساب الشركة (تحويل / إيداع)</option>${STAFF().map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join('')}</select></label>
   <label class="f span2">ملاحظات<input id="cp_n" placeholder="مثلاً: رقم التحويل"></label></div>
   <div id="cp_prev" class="small"></div>
   <div class="row"><div class="photos" id="cp_box"></div><label class="btn">📷 صورة الإيصال أو التحويل<input type="file" id="cp_ph" accept="image/*" hidden></label></div>`,()=>{
    const a=n($('#cp_a').value);if(a<=0){toast('اكتب المبلغ');return false}if(a>debt+0.009){toast('المبلغ أكبر من المديونية ('+money(debt)+')');return false}
    const g=uid(),by=$('#cp_by').value;let left=a;
    for(const i of items){if(left<=0.009)break;const take=n(Math.min(left,i.bal));left=n(left-take);
      const pay={id:uid(),refType:i.type,refId:i.x.id,clientId:cid,date:$('#cp_d').value,amount:take,method:$('#cp_m').value,by,recBy:ME.id,recByName:ME.name,lump:g,notes:$('#cp_n').value.trim(),receipt:i===items[0]?receipt:''};if(i.sub!=null)pay.sub=+i.sub;S.payments.push(pay)}
    save();toast(`اتسجلت الدفعة ${money(a)} — المديونية بقت ${money(debt-a)}`);render();
  });
  const pv=()=>{let left=n($('#cp_a').value);const L=[];for(const i of items){if(left<=0.009)break;const t=n(Math.min(left,i.bal));left=n(left-t);L.push(`${esc(i.label)}: <b class="num">${money(t)}</b>${t<i.bal-0.009?' (جزء)':' ✓'}`)}$('#cp_prev').innerHTML=L.length?'هتتخصم من: '+L.join(' · '):''};
  $('#cp_a').oninput=pv;
  $('#cp_ph').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{receipt=await compress(f,900,.6);$('#cp_box').innerHTML=`<figure><img src="${receipt}" alt="الإيصال"></figure>`}catch(_){toast('معرفتش أقرا الصورة')}};
}
Object.assign(X9,{clientPay:(t,id)=>openClientPay(id)});
Object.assign(NEED9,{clientPay:'client_pay'});
function pickClientPay(){
  const L=CL().map(c=>({c,b:n(openItems(c.id).reduce((a,i)=>a+i.bal,0))})).filter(x=>x.b>0.009).sort((a,b)=>b.b-a.b);
  if(!L.length){toast('مفيش عملاء عليهم مديونية');return}
  modal(`<h3>دفعة على حساب عميل</h3><label class="f">العميل<select id="pk_c">${L.map(x=>`<option value="${x.c.id}">${esc(cName(x.c))} — ${money(x.b)}</option>`).join('')}</select></label>`,()=>{const id=$('#pk_c').value;setTimeout(()=>openClientPay(id),0)});
  const ok=$('#mOk');if(ok)ok.textContent='التالي';
}
Object.assign(X9,{pickClientPay:()=>pickClientPay()});Object.assign(NEED9,{pickClientPay:'client_pay'});

/* =====================================================================
   التشغيل
   ===================================================================== */
setTimeout(()=>{const m=document.getElementById('main');if(m&&/بيحمّل/.test(m.textContent)){m.innerHTML='<div class="panel grid" style="max-width:520px;margin:30px auto"><h2>التحميل واخد وقت</h2><div class="muted">السيستم مش قادر يوصل لقاعدة البيانات. اتأكد إن النت شغال، وجرب واي فاي لو على باقة موبايل.</div><div class="row"><button class="btn pri" onclick="location.reload()">جرب تاني</button></div></div>'}},25000);
(async()=>{
  const cfg=getFbConfig();
  if(cfg){
    try{await initOnline(cfg);return}
    catch(e){
      S=emptyState();
      $('#main').innerHTML=`<div class="panel grid" style="max-width:520px;margin:30px auto"><h2>مش قادر أتصل</h2><div class="muted">السيستم مربوط أونلاين بس مش قادر يحمّل Firebase. اتأكد إن النت شغال وجرب تاني.</div><div class="row"><button class="btn pri" onclick="location.reload()">جرب تاني</button><button class="btn" data-act="disconnect">إلغاء الربط والرجوع للجهاز</button></div></div>`;
      return;
    }
  }
  try{S=await Promise.race([loadState(),new Promise(r=>setTimeout(()=>r(null),2500))])}catch(e){S=null}
  if(!S){S=demoState();save()}
  S.settings={...DEFAULT_SETTINGS,...S.settings};ALL_COLS.forEach(c=>S[c]=S[c]||[]);
  const sid=getSession();ME=S.users.find(u=>u.id===sid&&u.active!==false)||null;render();
})();
