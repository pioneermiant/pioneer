<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سيستم صيانة بايونير</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: شريط علوي + تبويبات أفقية + محتوى بعرض 1100 بكسل؛ ورقة التقرير بعرض A4؛ بوابة العيادة عمود واحد 640 */
:root{
  --bg:#eef1f4; --surface:#ffffff; --surface-2:#f6f8fa; --ink:#16202b; --muted:#5b6876; --line:#d6dde4;
  --accent:#b1243f; --accent-soft:#f7e3e7; --accent-ink:#ffffff;
  --ok:#1d7a4c; --ok-soft:#e1f2e9; --warn:#9a5c00; --warn-soft:#fbefd9; --bad:#c0392b; --bad-soft:#f9e1de;
  --info:#24588f; --info-soft:#e2ecf7;
  --header:#1b2530; --header-ink:#f1f4f7;
  --font:"IBM Plex Sans Arabic", Tahoma, "Segoe UI", Arial, sans-serif;
  --r:10px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151b; --surface:#17202a; --surface-2:#1d2833; --ink:#e5eaef; --muted:#97a4b2; --line:#2b3743;
  --accent:#e2607a; --accent-soft:#3a1d25; --accent-ink:#1a0d11;
  --ok:#5fc795; --ok-soft:#163327; --warn:#e6ad4f; --warn-soft:#3a2c13; --bad:#ef7a6c; --bad-soft:#3d1c19;
  --info:#7fb2e6; --info-soft:#17283a;
  --header:#0a0f14; --header-ink:#e5eaef; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151b; --surface:#17202a; --surface-2:#1d2833; --ink:#e5eaef; --muted:#97a4b2; --line:#2b3743;
  --accent:#e2607a; --accent-soft:#3a1d25; --accent-ink:#1a0d11;
  --ok:#5fc795; --ok-soft:#163327; --warn:#e6ad4f; --warn-soft:#3a2c13; --bad:#ef7a6c; --bad-soft:#3d1c19;
  --info:#7fb2e6; --info-soft:#17283a;
  --header:#0a0f14; --header-ink:#e5eaef; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.3}
h2{font-size:1.35rem}
h3{font-size:1.05rem}
a{color:var(--info)}
.top{background:var(--header);color:var(--header-ink);position:sticky;top:0;z-index:20}
.top-in{max-width:1100px;margin:0 auto;padding-block:10px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-bottom:6px}
.brand b{font-size:1.1rem;letter-spacing:.3px}
.brand small{opacity:.75;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.hbtn{background:none;border:1px solid rgba(255,255,255,.25);color:var(--header-ink);border-radius:6px;padding:1px 9px;font-size:.8rem;cursor:pointer}
.mode{font-size:.72rem;border-radius:99px;padding:0 8px;background:rgba(255,255,255,.12)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;color:var(--header-ink);opacity:.72;padding:9px 14px;border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer}
.tab:hover{opacity:1}
.tab.on{opacity:1;border-bottom-color:var(--accent);font-weight:600}
.cnt{background:var(--accent);color:#fff;border-radius:99px;padding:0 7px;font-size:.72rem;margin-inline-start:6px;font-weight:700}
main{max-width:1100px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}
main.narrow{max-width:660px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel h3{margin-bottom:10px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:760px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.g2,.g3{grid-template-columns:minmax(0,1fr)}}
label.f{display:grid;gap:4px;font-size:.85rem;color:var(--muted);min-width:0}
label.f.span2{grid-column:span 2}
@media (max-width:480px){label.f.span2{grid-column:auto}}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0;color:var(--ink)}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;white-space:nowrap;color:var(--ink)}
.btn:hover{background:var(--surface-2)}
.btn:disabled{opacity:.55;cursor:wait}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{padding:4px 10px;font-size:.85rem}
.btn.big{padding:12px 20px;font-size:1.05rem}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:none}
.kpi{display:grid;gap:2px}
.kpi span{color:var(--muted);font-size:.85rem}
.kpi b{font-size:1.45rem}
.tbl-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:.92rem}
.t th{text-align:right;color:var(--muted);font-weight:500;font-size:.8rem;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr.click{cursor:pointer}
.t tr.click:hover td{background:var(--surface-2)}
.t tfoot td{font-weight:700;border-bottom:0}
.num{text-align:left;direction:ltr;unicode-bidi:plaintext;white-space:nowrap}
.pill{display:inline-block;padding:1px 10px;border-radius:99px;font-size:.78rem;font-weight:600;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-acc{background:var(--accent-soft);color:var(--accent)}
.p-info{background:var(--info-soft);color:var(--info)}
.p-mut{background:var(--surface-2);color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.empty{color:var(--muted);padding:16px;text-align:center;border:1px dashed var(--line);border-radius:8px}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:10px 14px}
.banner.info{background:var(--info-soft);color:var(--info)}
.sec-title{font-size:.8rem;color:var(--muted);letter-spacing:.4px;font-weight:600;margin:6px 0 2px}
.part-row{display:grid;grid-template-columns:minmax(0,3fr) 80px 110px 110px 44px 36px;gap:8px;align-items:center}
@media (max-width:640px){.part-row{grid-template-columns:minmax(0,1fr) 70px 90px;padding-bottom:8px;border-bottom:1px solid var(--line)}.part-row .lt{grid-column:1/2}}
.pr-cam{width:44px;height:40px;border:1px dashed var(--line);border-radius:8px;display:grid;place-items:center;cursor:pointer;overflow:hidden;font-size:1.1rem}
.pr-cam img{width:100%;height:100%;object-fit:cover}
.totals{display:grid;gap:4px;max-width:340px;margin-inline-start:auto}
.totals div{display:flex;justify-content:space-between}
.totals .grand{font-size:1.15rem;font-weight:700;border-top:1px solid var(--line);padding-top:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);padding:7px 16px;cursor:pointer;color:var(--ink)}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.sig{border:1px dashed var(--line);border-radius:8px;background:#fff;touch-action:none;width:100%;height:140px;display:block}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.photos figure{margin:0;position:relative}
.photos img{width:96px;height:96px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in}
.photos button{position:absolute;top:2px;left:2px}
.sheet-wrap{overflow-x:auto;background:var(--surface-2);border-radius:var(--r);padding:16px;border:1px solid var(--line)}
.sheet-wrap > div{margin:0 auto;box-shadow:0 2px 14px rgba(0,0,0,.12)}
.modal-bg{position:fixed;inset:0;background:rgba(10,15,20,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:30px 16px}
.modal{background:var(--surface);border-radius:12px;width:100%;max-width:640px;padding:18px;display:grid;gap:12px;border:1px solid var(--line)}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--header);color:var(--header-ink);padding:10px 18px;border-radius:99px;z-index:60;box-shadow:0 4px 16px rgba(0,0,0,.25);max-width:90vw;text-align:center}
.dev-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) 36px;gap:8px}
@media (max-width:480px){.dev-row{grid-template-columns:minmax(0,1fr) 36px}}
.req{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:8px;background:var(--surface);min-width:0}
.req .when{font-weight:600}
.req p{margin:0;white-space:pre-wrap}
.board td{vertical-align:top}
.chip{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:2px 8px;margin:2px;font-size:.82rem;background:var(--surface-2)}
.chip.urg{border-color:var(--bad);color:var(--bad)}
.toggle{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer}
.toggle input{width:22px;height:22px}
.toggle.on{border-color:var(--bad);background:var(--bad-soft)}
.done-card{border:2px solid var(--ok);background:var(--ok-soft);border-radius:var(--r);padding:16px;display:grid;gap:6px}
pre.code{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px;overflow-x:auto;font-size:.78rem;direction:ltr;text-align:left;max-height:260px}
ol.steps{margin:0;padding-right:20px;display:grid;gap:4px}
@media print{
  .top,.no-print,.toast{display:none!important}
  body{background:#fff}
  main{padding:0;max-width:none}
  .sheet-wrap{border:0;padding:0;background:#fff;overflow:visible}
  .sheet-wrap > div{box-shadow:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top no-print">
  <div class="top-in">
    <div class="brand"><b id="brandName">Pioneer</b><small id="brandSub">نظام الصيانة</small></div>
    <nav class="tabs" id="tabs"></nav>
  </div>
</header>
<main id="main"><div class="empty">بيحمّل…</div></main>
<input type="file" id="importFile" accept="application/json" hidden>

<script>
/* =====================================================================
   التخزين المحلي (IndexedDB مع بديل localStorage)
   ===================================================================== */
const DBN='pioneer-maint-v1', ST='kv';
function idb(){return new Promise((res,rej)=>{let done=false;const t=setTimeout(()=>{if(!done){done=true;rej(new Error('idb timeout'))}},1500);try{const r=indexedDB.open(DBN,1);r.onupgradeneeded=()=>r.result.createObjectStore(ST);r.onsuccess=()=>{if(!done){done=true;clearTimeout(t);res(r.result)}};r.onerror=r.onblocked=()=>{if(!done){done=true;clearTimeout(t);rej(r.error)}}}catch(e){done=true;clearTimeout(t);rej(e)}})}
window.addEventListener('error',e=>{const m=document.getElementById('main');if(m&&/بيحمّل/.test(m.textContent))m.innerHTML='<div class="empty">حصلت مشكلة في التشغيل: '+String(e.message).replace(/</g,'&lt;')+'</div>'});
window.addEventListener('unhandledrejection',e=>{const m=document.getElementById('main');if(m&&/بيحمّل/.test(m.textContent))m.innerHTML='<div class="empty">حصلت مشكلة في التشغيل: '+String(e.reason&&e.reason.message||e.reason).replace(/</g,'&lt;')+'</div>'});
async function loadState(){
  try{const db=await idb();const v=await new Promise(res=>{const q=db.transaction(ST).objectStore(ST).get('state');q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)});if(v)return v}catch(e){}
  try{return JSON.parse(localStorage.getItem('pm-state'))}catch(e){return null}
}
let saveTimer=null;
function save(){if(ONLINE){persistOnline();return}clearTimeout(saveTimer);saveTimer=setTimeout(persistLocal,150)}
async function persistLocal(){
  try{const db=await idb();await new Promise((res,rej)=>{const t=db.transaction(ST,'readwrite');t.objectStore(ST).put(S,'state');t.oncomplete=res;t.onerror=()=>rej(t.error)})}
  catch(e){try{localStorage.setItem('pm-state',JSON.stringify(S))}catch(err){if(!persistLocal.warned){persistLocal.warned=1;toast('المتصفح ده مش بيسمح بحفظ البيانات — اللي هتكتبه هيضيع لما تقفل الصفحة')}}}
}

/* =====================================================================
   أدوات
   ===================================================================== */
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n=v=>Math.round((parseFloat(v)||0)*100)/100;
const money=v=>n(v).toLocaleString('en-US')+' ج.م';
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const today=()=>ymd(new Date());
function addDays(s,k){const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+k);return ymd(d)}
const fd=s=>s?s.split('-').reverse().join('/'):'—';
const daysTo=s=>Math.round((new Date(s+'T12:00:00')-new Date(today()+'T12:00:00'))/864e5);
const pad=v=>String(v).padStart(4,'0');
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3200)}
function nowH(){const d=new Date();return d.getHours()+d.getMinutes()/60}
function fmtH(h){const hh=((Math.floor(h)+11)%12)+1;return hh+(h<12?' ص':' م')}
function dayName(d){return new Date(d+'T12:00:00').toLocaleDateString('ar-EG',{weekday:'long'})}
function dayLabel(d){const k=daysTo(d);return (k===0?'النهارده':k===1?'بكره':k===-1?'امبارح':dayName(d))+' '+fd(d)}
function fdt(iso){if(!iso)return '—';const d=new Date(iso);return fd(ymd(d))+' '+d.toLocaleTimeString('ar-EG',{hour:'numeric',minute:'2-digit'})}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('load '+src));document.head.appendChild(s)})}

const VISIT={contract:'زيارة ضمن عقد الصيانة',periodic:'زيارة دورية',emergency:'زيارة طارئة (بلاغ عطل)'};
const WORK=['صيانة','فحص','تركيب','إصلاح'];
const CTYPE={contract:'عقد صيانة سنوي',visit:'بالزيارة'};
const ROLE={admin:'مدير',engineer:'مهندس',clinic:'عيادة'};
const RKIND={fault:'عطل في الجهاز',visit:'طلب زيارة صيانة'};
const RSTATUS={new:['جديد – مستني تحديد مهندس','p-warn'],assigned:['متحدد مهندس','p-info'],done:['اتعملت الزيارة','p-ok'],cancelled:['اتلغى','p-mut']};
const WEEKDAYS=['الأحد','الاتنين','التلات','الأربع','الخميس','الجمعة','السبت'];

/* =====================================================================
   البيانات
   ===================================================================== */
const DEFAULT_SETTINGS={
  company:'Pioneer', sub:'for laser maintenance', phone:'', address:'', logo:'',
  visitFee:1500, contractVisitFee:0, nextNo:1, engineer:'', showPrices:true,
  workStart:12, workEnd:20, slotHours:2, crews:3, offDays:[],
  methods:['نقدي','تحويل بنكي','إنستاباي','فودافون كاش','شيك'],
  terms:[
    'الشركة غير مسؤولة عن الأعطال الناتجة عن سوء الاستخدام أو تذبذب التيار الكهربائي.',
    'الضمان على قطع الغيار المستبدلة حسب ضمان الشركة ولا يشمل الكسر أو سوء الاستخدام.',
    'يجب إبلاغ الشركة بأي عطل فور حدوثه، وعدم السماح لغير مهندسي الشركة بفتح الجهاز.',
    'القطع القديمة المستبدلة تُسلَّم للمهندس ما لم يُتفق على غير ذلك.',
    'توقيع العميل يفيد استلام الجهاز في حالة تشغيل جيدة.'
  ]
};
const COLS=['users','clients','parts','reports','contracts','payments','requests'];
function emptyState(){return{v:2,demo:false,settings:JSON.parse(JSON.stringify(DEFAULT_SETTINGS)),users:[],clients:[],parts:[],reports:[],contracts:[],payments:[],requests:[]}}
function demoState(){
  const s=emptyState(); s.demo=true; s.settings.nextNo=4;
  const c1={id:uid(),name:'د. هالة سعيد',clinic:'عيادة ديرما كير',phone:'01001234567',address:'سموحة – الإسكندرية',type:'contract',notes:'',devices:[{name:'Candela GentleLase',model:'Pro',serial:'GL-2182'}]};
  const c2={id:uid(),name:'د. أحمد فؤاد',clinic:'مركز سكين لاين',phone:'01229876543',address:'مدينة نصر – القاهرة',type:'visit',notes:'',devices:[{name:'Candela GentleMax',model:'Mini',serial:'GM-5056'}]};
  const c3={id:uid(),name:'د. ريم عادل',clinic:'عيادة لافندر',phone:'01115550011',address:'المعادي – القاهرة',type:'visit',notes:'',devices:[{name:'Candela GentleLase',model:'Mini',serial:'GL-3310'}]};
  s.clients=[c1,c2,c3];
  const P=(name,code,buy,sell,qty,min)=>({id:uid(),name,code,buy,sell,qty,min});
  s.parts=[P('فلاش لامب','FL-01',9000,12500,4,2),P('فلتر مياه DI','DI-02',650,1100,10,4),P('شباك الهاند بيس','HW-03',1800,2600,3,2),P('طلمبة مياه','WP-04',4200,5800,1,1),P('ديستانس جيج','DG-05',350,600,6,3)];
  const eng={id:uid(),name:'م. كريم (تجريبي)',username:'karim',hash:pwHash('karim','123456'),role:'engineer',active:true};
  const cli={id:uid(),name:'مركز سكين لاين',username:'skinline',hash:pwHash('skinline','123456'),role:'clinic',clientId:c2.id,active:true};
  s.users=[eng,cli];
  const R=(no,days,c,vt,work,comp,done,parts,fee,disc,method,term,paid,due,by,recv)=>{const tot=fee+parts.reduce((a,p)=>a+p.qty*p.price,0)-disc;return{id:uid(),no,date:addDays(today(),days),clientId:c.id,device:c.devices[0],visitType:vt,work,complaint:comp,done,parts,oldReceived:parts.length>0,visitFee:fee,discount:disc,total:tot,method,term,paid:term==='cash'?tot:paid,due,by,payReceived:true,payPhoto:'',engineer:by?eng.name:'م. محمود',receiver:recv,notes:'',sigEng:'',sigClient:'',photos:[]}};
  const r1=R(1,-20,c1,'contract','صيانة','ضعف في الطاقة الخارجة','تغيير فلتر المياه وتنظيف الشباك ومعايرة الطاقة',[{partId:s.parts[1].id,name:'فلتر مياه DI',qty:1,price:1100,cost:650,photo:''}],0,0,'نقدي','cash',0,'',undefined,'أ. سارة');
  const r2=R(2,-9,c2,'periodic','إصلاح','الجهاز بيفصل بعد 10 دقايق تشغيل','تغيير الفلاش لامب واختبار التشغيل ساعة',[{partId:s.parts[0].id,name:'فلاش لامب',qty:1,price:12500,cost:9000,photo:''}],1500,500,'تحويل بنكي','credit',5000,addDays(today(),-1),eng.id,'د. أحمد فؤاد');

function nSlots(){const s=S.settings;return Math.max(1,Math.floor((n(s.workEnd)-n(s.workStart))/Math.max(.5,n(s.slotHours))))}
function slotStart(i){const s=S.settings;return n(s.workStart)+i*n(s.slotHours)}
function slotLabel(i){return `من ${fmtH(slotStart(i))} لـ ${fmtH(slotStart(i)+n(S.settings.slotHours))}`}
const crews=()=>Math.max(1,parseInt(S.settings.crews)||1);
const isOff=d=>(S.settings.offDays||[]).includes(new Date(d+'T12:00:00').getDay());
function firstOpen(){
  const h=nowH();let d=today(),min=0;
  if(h>=n(S.settings.workEnd)){d=addDays(d,1)}
  else{while(min<nSlots()&&slotStart(min)<h)min++;if(min>=nSlots()){d=addDays(d,1);min=0}}
  return{d,min};
}
const slotCount=(d,k,exceptId)=>S.requests.filter(r=>r.date===d&&r.slot===k&&r.status!=='cancelled'&&r.id!==exceptId).length;
async function allocate(){
  const cap=crews();let {d,min}=firstOpen();
  for(let i=0;i<60;i++,d=addDays(d,1),min=0){
    if(isOff(d))continue;
    let slot=-1;
    if(ONLINE){
      const ref=FB.db.doc('days/'+d);
      slot=await FB.db.runTransaction(async tx=>{const s=await tx.get(ref);const data=s.exists?s.data():{};for(let k=min;k<nSlots();k++){const c=data['s'+k]||0;if(c<cap){tx.set(ref,{['s'+k]:c+1},{merge:true});return k}}return -1});
    }else{for(let k=min;k<nSlots();k++){if(slotCount(d,k)<cap){slot=k;break}}}
    if(slot>=0)return{date:d,slot};
  }
  return null;
}
function moveSlot(oldD,oldS,newD,newS){
  if(!ONLINE)return;
  const inc=(d,s,v)=>FB.db.doc('days/'+d).set({['s'+s]:firebase.firestore.FieldValue.increment(v)},{merge:true}).catch(()=>{});
  if(oldD&&oldS!=null)inc(oldD,oldS,-1);
  if(newD&&newS!=null)inc(newD,newS,1);
}

function readParts(){return $$('#partRows .part-row').map(row=>{const p=part(row.querySelector('.pr-part').value);return p?{partId:p.id,name:p.name,qty:Math.max(1,parseInt(row.querySelector('.pr-qty').value)||1),price:n(row.querySelector('.pr-price').value),photo:FORM.partPhotos[row.dataset.k]||''}:null}).filter(Boolean)}
function calc(){
  const parts=readParts();
  $$('#partRows .part-row').forEach(row=>{const q=parseInt(row.querySelector('.pr-qty').value)||0,pr=n(row.querySelector('.pr-price').value);row.querySelector('.lt').textContent=row.querySelector('.pr-part').value?money(q*pr):'—'});
  const pt=parts.reduce((a,p)=>a+p.qty*p.price,0), fee=n($('#f_fee')?.value), disc=n($('#f_disc')?.value), tot=n(fee+pt-disc);
  const paid=FORM.term==='cash'?tot:n($('#f_paid')?.value);
  const el=$('#totals'); if(!el)return;
  $('#recvBox').hidden=!(paid>0);
  el.innerHTML=`<div><span>الزيارة</span><span class="num">${money(fee)}</span></div><div><span>قطع الغيار</span><span class="num">${money(pt)}</span></div>${disc?`<div><span>خصم</span><span class="num">- ${money(disc)}</span></div>`:''}<div class="grand"><span>الإجمالي</span><span class="num">${money(tot)}</span></div>${FORM.term==='credit'?`<div><span>المدفوع</span><span class="num">${money(paid)}</span></div><div style="color:var(--accent);font-weight:600"><span>المتبقي (آجل)</span><span class="num">${money(tot-paid)}</span></div>`:''}`;
}

  const old=FORM.id?S.reports.find(x=>x.id===FORM.id):null;
  const need={};parts.forEach(p=>need[p.partId]=(need[p.partId]||0)+p.qty);
  const back={};(old?.parts||[]).forEach(p=>back[p.partId]=(back[p.partId]||0)+p.qty);
  for(const pid in need){const p=part(pid);const avail=n(p.qty)+(back[pid]||0);if(need[pid]>avail){toast(`الكمية المتاحة من "${p.name}" ${avail} بس`);return}}

function compress(file,max=1000,q=.65){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}
function sigPad(key){
  const cv=$('#'+key);if(!cv)return;
  const r=cv.getBoundingClientRect();cv.width=r.width*2;cv.height=r.height*2;const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);
  if(FORM[key]){const im=new Image();im.onload=()=>x.drawImage(im,0,0,cv.width,cv.height);im.src=FORM[key]}
  let drawing=false;
  const pt=e=>{const b=cv.getBoundingClientRect();return[(e.clientX-b.left)*2,(e.clientY-b.top)*2]};
  cv.onpointerdown=e=>{drawing=true;cv.setPointerCapture(e.pointerId);x.strokeStyle='#14306b';x.lineWidth=4;x.lineCap='round';x.lineJoin='round';x.beginPath();x.moveTo(...pt(e))};
  cv.onpointermove=e=>{if(!drawing)return;x.lineTo(...pt(e));x.stroke()};
  cv.onpointerup=cv.onpointercancel=()=>{if(drawing)FORM[key]=cv.toDataURL('image/png');drawing=false};
}

async function reportBlob(r){
  const holder=document.createElement('div');holder.style.cssText='position:fixed;left:-12000px;top:0;width:794px';
  holder.innerHTML=reportHTML(r);document.body.appendChild(holder);
  const node=holder.firstElementChild;
  await Promise.all([...node.querySelectorAll('img')].map(i=>i.complete?0:new Promise(z=>{i.onload=i.onerror=z})));
  const w=794,h=node.scrollHeight;
  try{
    const xml=new XMLSerializer().serializeToString(node);
    const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><foreignObject x="0" y="0" width="${w}" height="${h}">${xml}</foreignObject></svg>`;
    const img=new Image();img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);await img.decode();
    const cv=document.createElement('canvas');cv.width=w*2;cv.height=h*2;const x=cv.getContext('2d');x.scale(2,2);x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0);
    const b=await new Promise(z=>cv.toBlob(z,'image/png'));if(!b)throw new Error('blank');return b;
  }catch(e){
    await loadH2C();const cv=await html2canvas(node,{scale:2,backgroundColor:'#ffffff'});return await new Promise(z=>cv.toBlob(z,'image/png'));
  }finally{holder.remove()}
}

function viewMoves(){
  let rows=[];S.reports.forEach(r=>r.parts.forEach(p=>rows.push({r,p,c:client(r.clientId)})));
  rows=rows.filter(x=>(!MV.part||x.p.partId===MV.part)&&(!MV.client||x.r.clientId===MV.client)&&(!MV.from||x.r.date>=MV.from)&&(!MV.to||x.r.date<=MV.to)).sort((a,b)=>b.r.date.localeCompare(a.r.date));
  const totQ=rows.reduce((a,x)=>a+x.p.qty,0),totV=rows.reduce((a,x)=>a+x.p.qty*x.p.price,0);
  const g={};rows.forEach(x=>{const k=x.r.clientId+'|'+(x.p.partId||x.p.name);g[k]=g[k]||{c:x.c,name:x.p.name,qty:0,val:0,last:''};g[k].qty+=x.p.qty;g[k].val+=x.p.qty*x.p.price;if(x.r.date>g[k].last)g[k].last=x.r.date});
  const gs=Object.values(g).sort((a,b)=>b.qty-a.qty);
  const sel=(id,arr,v,all)=>`<select id="${id}"><option value="">${all}</option>${arr.map(([k,l])=>`<option value="${k}" ${k===v?'selected':''}>${esc(l)}</option>`).join('')}</select>`;

    <label class="f">القطعة${sel('mv_part',S.parts.map(p=>[p.id,p.name]),MV.part,'كل القطع')}</label>
    <label class="f">العميل / العيادة${sel('mv_client',S.clients.map(c=>[c.id,c.name+(c.clinic?' – '+c.clinic:'')]),MV.client,'كل العملاء')}</label>

  </div>
  <div class="grid g3"><div class="panel kpi"><span>عدد القطع اللي طلعت</span><b>${totQ}</b></div><div class="panel kpi"><span>قيمتها (سعر البيع)</span><b>${money(totV)}</b></div><div class="panel kpi"><span>عدد العملاء</span><b>${new Set(rows.map(x=>x.r.clientId)).size}</b></div></div>
  <div class="panel"><h3>ملخص: كل عميل خد إيه</h3>${gs.length?`<div class="tbl-wrap"><table class="t"><thead><tr><th>العميل / العيادة</th><th>القطعة</th><th>العدد</th><th>القيمة</th><th>آخر مرة</th></tr></thead><tbody>${gs.map(x=>`<tr><td><b>${esc(x.c?.name||'—')}</b><div class="muted small">${esc(x.c?.clinic||'')}</div></td><td>${esc(x.name)}</td><td><b>${x.qty}</b></td><td class="num">${money(x.val)}</td><td>${fd(x.last)}</td></tr>`).join('')}</tbody><tfoot><tr><td colspan="2">الإجمالي</td><td>${totQ}</td><td class="num">${money(totV)}</td><td></td></tr></tfoot></table></div>`:'<div class="empty">مفيش قطع طلعت بالفلتر ده</div>'}</div>
  <div class="panel"><h3>كل حركة بالتفصيل</h3>${rows.length?`<div class="tbl-wrap"><table class="t"><thead><tr><th>التاريخ</th><th>تقرير</th><th>العميل</th><th>القطعة</th><th>العدد</th><th>السعر</th><th>المهندس</th><th>صورة</th></tr></thead><tbody>${rows.map(x=>`<tr class="click" data-view="${x.r.id}"><td>${fd(x.r.date)}</td><td class="num">#${pad(x.r.no)}</td><td>${esc(x.c?.name||'—')}<div class="muted small">${esc(x.c?.clinic||'')}</div></td><td>${esc(x.p.name)}</td><td>${x.p.qty}</td><td class="num">${money(x.p.price)}</td><td>${esc(x.r.engineer||'')}</td><td>${x.p.photo?'📷':''}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">—</div>'}</div>`;
}

function viewAR(){
  const items=openItems(); const tot=items.reduce((a,i)=>a+i.bal,0);
  const late=items.filter(i=>daysTo(i.due)<0).reduce((a,i)=>a+i.bal,0);
  const pays=[...S.payments].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,40);
  const refName=p=>{if(p.refType==='report'){const r=S.reports.find(x=>x.id===p.refId);return r?`${client(r.clientId)?.name||''} — تقرير #${pad(r.no)}`:'—'}const k=S.contracts.find(x=>x.id===p.refId);return k?`${client(k.clientId)?.name||''} — عقد صيانة`:'—'};

   <label class="f">الاسم${r==='engineer'?' (بيظهر في التقرير)':''}<input id="us_name" value="${esc(u?.name||(r==='clinic'?(c?.clinic||c?.name||''):''))}" required></label>

    const name=$('#us_name').value.trim(),un=normD($('#us_user').value).trim().toLowerCase(),pw=normD($('#us_pass')?.value||'');

    if(!ONLINE){

const RULES=`rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    function signed() { return request.auth != null; }
    function me() { return get(/databases/$(database)/documents/users/$(request.auth.uid)).data; }
    function hasUser() { return signed() && exists(/databases/$(database)/documents/users/$(request.auth.uid)); }
    function isAdmin() { return hasUser() && me().role == 'admin' && me().active != false; }
    function isStaff() { return hasUser() && me().role in ['admin', 'engineer'] && me().active != false; }

    match /meta/admin { allow read: if true; allow create: if signed() && !exists(/databases/$(database)/documents/meta/admin); }
    match /meta/settings { allow read: if signed(); allow write: if isAdmin(); }
    match /meta/counter { allow read, write: if isStaff(); }

    match /users/{uid} {
      allow read: if signed() && (request.auth.uid == uid || isStaff());
      allow create: if isAdmin() || (request.auth.uid == uid && request.resource.data.role == 'admin' && !exists(/databases/$(database)/documents/meta/admin));
      allow update, delete: if isAdmin();
    }
    match /clients/{id} {
      allow read: if isStaff() || (hasUser() && me().clientId == id);
      allow create, update: if isStaff();
      allow delete: if isAdmin();
    }
    match /parts/{id} {
      allow read, create, update: if isStaff();
      allow delete: if isAdmin();
    }
    match /{col}/{id} {
      allow read: if col in ['reports', 'contracts', 'payments'] && (isStaff() || (hasUser() && resource.data.clientId == me().clientId));
      allow create, update: if col in ['reports', 'contracts', 'payments'] && isStaff();
      allow delete: if col in ['reports', 'contracts', 'payments'] && isAdmin();
    }
    match /requests/{id} {
      allow read: if isStaff() || (signed() && resource.data.uid == request.auth.uid);
      allow create: if isStaff() || (hasUser() && request.resource.data.uid == request.auth.uid && request.resource.data.clientId == me().clientId);
      allow update: if isStaff();
      allow delete: if isAdmin();
    }
    match /days/{d} { allow read, write: if signed(); }
  }
}`;

      <li>في Firestore افتح تبويب <b>Rules</b>، امسح اللي موجود، والصق القواعد اللي تحت، ودوس <b>Publish</b>.</li>
      <li>دوس على الترس جنب Project Overview ← <b>Project settings</b> ← تحت في Your apps دوس أيقونة الويب <b class="num">&lt;/&gt;</b>، اكتب أي اسم ودوس Register. هيظهرلك كود فيه <span class="num">firebaseConfig</span> — انسخه كله والصقه هنا.</li>
      <li>دوس "فعّل الربط". هيطلب منك تعمل حساب المدير الأونلاين، وبعدين تنقل بياناتك وتعمل حسابات المهندسين والعيادات.</li>
    </ol>
    ${rulesBlock()}
    <label class="f">الصق كود firebaseConfig هنا<textarea id="fb_cfg" dir="ltr" style="min-height:120px;font-size:.8rem" placeholder="const firebaseConfig = { apiKey: '...', authDomain: '...', projectId: '...', ... };"></textarea></label>
    <div><button class="btn pri" data-act="connect">فعّل الربط</button></div></div>`;
}
function rulesBlock(){return `<div class="row between"><span class="muted small">قواعد Firestore</span><button type="button" class="btn sm" data-act="copyRules">انسخ القواعد</button></div><pre class="code" id="rulesTxt">${esc(RULES)}</pre>`}
function bindSettings(){
  const f=$('#sf');if(!f)return;
  if(ONLINE)FB.db.doc('meta/counter').get().then(d=>{if(d.exists&&$('#s_no'))$('#s_no').value=d.data().next}).catch(()=>{});
  f.onsubmit=e=>{e.preventDefault();const s=S.settings;
    const ws=Math.max(0,Math.min(23,parseInt($('#s_ws').value)||12)),we=Math.max(ws+1,Math.min(24,parseInt($('#s_we').value)||20));
    Object.assign(s,{company:$('#s_company').value.trim()||'Pioneer',sub:$('#s_sub').value.trim(),phone:$('#s_phone').value.trim(),visitFee:n($('#s_fee').value),contractVisitFee:n($('#s_cfee').value),showPrices:$('#s_prices').checked,
      workStart:ws,workEnd:we,slotHours:Math.max(.5,n($('#s_sh').value)||2),crews:Math.max(1,parseInt($('#s_crews').value)||1),offDays:$$('.s_off').filter(x=>x.checked).map(x=>+x.value),
      methods:$('#s_methods').value.split('\n').map(x=>x.trim()).filter(Boolean),terms:$('#s_terms').value.split('\n').map(x=>x.trim()).filter(Boolean)});
    const no=Math.max(1,parseInt($('#s_no').value)||1);
    if(ONLINE)FB.db.doc('meta/counter').set({next:no}).catch(er=>toast(fbErr(er)));else s.nextNo=no;
    if(!s.methods.length)s.methods=['نقدي'];save();toast('اتحفظت الإعدادات');render()};
  $('#s_logo').onchange=async e=>{const fl=e.target.files[0];if(!fl)return;S.settings.logo=await compress(fl,400,.8);save();render()};
  const d=$('#s_logo_del');if(d)d.onclick=()=>{S.settings.logo='';save();render()};
}
async function migrateLocal(){
  const L=await loadState();
  if(!L||!(L.clients||[]).length){toast('مفيش بيانات محلية على الجهاز ده');return}
  if(L.demo){toast('البيانات اللي على الجهاز تجريبية — امسحها الأول أو ابدأ على نضيف');return}
  toast('بيتم النقل…');
  const ops=[];['clients','parts','reports','contracts','payments','requests'].forEach(c=>(L[c]||[]).forEach(x=>{x=JSON.parse(JSON.stringify(x));if(c==='reports')(x.parts||[]).forEach(q=>delete q.cost);if(c==='payments'&&!x.clientId){const ref=(x.refType==='report'?L.reports:L.contracts||[]).find(y=>y.id===x.refId);x.clientId=ref?.clientId||''}ops.push([c,x])}));
  try{
    for(let i=0;i<ops.length;i+=350){const b=FB.db.batch();ops.slice(i,i+350).forEach(([c,x])=>b.set(FB.db.collection(c).doc(x.id),JSON.parse(JSON.stringify(x))));await b.commit()}
    await FB.db.doc('meta/settings').set({...DEFAULT_SETTINGS,...L.settings});
    await FB.db.doc('meta/counter').set({next:L.settings?.nextNo||1});
    toast(`اتنقل ${ops.length} سجل للأونلاين`);
  }catch(e){toast('النقل وقف: '+fbErr(e))}
}

/* =====================================================================
   مودال وتأكيد
   ===================================================================== */
function modal(html,onOk){
  closeModal(true);
  const bg=document.createElement('div');bg.className='modal-bg';bg.id='modal';
  bg.innerHTML=`<form class="modal" id="modalForm">${html}<div class="row" style="justify-content:flex-end"><button type="button" class="btn" id="mCancel">إلغاء</button><button type="submit" class="btn pri" id="mOk">حفظ</button></div></form>`;
  document.body.appendChild(bg);
  $('#mCancel').onclick=()=>closeModal();bg.onclick=e=>{if(e.target===bg)closeModal()};
  $('#modalForm').onsubmit=e=>{e.preventDefault();let r;try{r=onOk()}catch(er){toast(String(er));return}
    if(r&&r.then){const b=$('#mOk');b.disabled=true;r.then(v=>{if(v!==false)closeModal();else b.disabled=false}).catch(er=>{toast(typeof er==='string'?er:fbErr(er));b.disabled=false})}
    else if(r!==false)closeModal()};
  const first=bg.querySelector('input:not([type=hidden]):not([type=file]),select');if(first)first.focus();
}
function closeModal(silent){const m=$('#modal');if(m)m.remove();if(!silent&&PENDING){PENDING=false;liveRender()}}
function confirmBox(msg,onYes){
  closeModal(true);const bg=document.createElement('div');bg.className='modal-bg';bg.id='modal';
  bg.innerHTML=`<div class="modal"><div>${esc(msg)}</div><div class="row" style="justify-content:flex-end"><button class="btn" id="cNo">لا</button><button class="btn pri" id="cYes" style="background:var(--bad);border-color:var(--bad)">أيوه</button></div></div>`;
  document.body.appendChild(bg);$('#cNo').onclick=()=>closeModal();$('#cYes').onclick=()=>{closeModal(true);onYes()};
}

/* =====================================================================
   الأحداث
   ===================================================================== */
document.addEventListener('click',e=>{
  const rq=e.target.closest('[data-rqf]');if(rq){RQF=rq.dataset.rqf;render();return}
  const ct=e.target.closest('[data-ctab]');if(ct){CTAB=ct.dataset.ctab;render();window.scrollTo(0,0);return}
  const st=e.target.closest('[data-stab]');if(st){STAB=st.dataset.stab;render();return}
  const t=e.target.closest('[data-go],[data-view],[data-act],[data-clear],[data-delphoto]');if(!t)return;
  if(t.dataset.view){e.preventDefault();go('view',t.dataset.view);return}
  if(t.dataset.go){e.preventDefault();go(t.dataset.go,t.dataset.p||null);return}
  if(t.dataset.clear){const k=t.dataset.clear;FORM[k]='';const cv=$('#'+k);const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);return}
  if(t.dataset.delphoto!==undefined){FORM.photos.splice(+t.dataset.delphoto,1);drawPhotos();return}
  const a=t.dataset.act,id=t.dataset.id;
  const ADMIN_ACTS=['delClient','addContract','editContract','addPart','editPart','restock','redue','delPay','delReport','clearDemo','export','import','wipe','addUser','addClinicUser','editUser','toggleUser','reschedule','cancelReq','connect','migrate','mvPart','mvClient'];
  if(ADMIN_ACTS.includes(a)&&!isAdmin()){toast('الصلاحية دي للمدير بس');return}
  switch(a){
    case 'logout':CTAB='req';if(ONLINE){FB.auth.signOut()}else{ME=null;setSession(null);VIEW='home';render()}break;
    case 'myPass':openMyPass();break;
    case 'showPass':{const i=$('#li_pass');i.type=i.type==='password'?'text':'password';t.textContent=i.type==='password'?'إظهار':'إخفاء';break}
    case 'resetLocal':confirmBox('مسح كل البيانات اللي على الجهاز ده والبدء من جديد؟',()=>{S=demoState();ME=null;setSession(null);save();render()});break;
    case 'showImg':showImg(t.dataset.src);break;
    case 'clinicReport':openClinicReport(id);break;
    case 'addUser':openUserModal(null,'engineer');break;
    case 'addClinicUser':if(!S.clients.length){toast('ضيف العميل الأول');break}openUserModal(null,'clinic',id||'');break;
    case 'editUser':openUserModal(id);break;
    case 'toggleUser':{const u=S.users.find(x=>x.id===id);u.active=u.active===false;saveUserDoc(u).catch(er=>toast(fbErr(er)));render();break}
    case 'addClient':openClientModal(null);break;
    case 'editClient':openClientModal(id);break;
    case 'delClient':{const has=S.reports.some(r=>r.clientId===id)||S.contracts.some(k=>k.clientId===id)||S.requests.some(r=>r.clientId===id);if(has){toast('العميل ده عليه تقارير أو عقود أو طلبات — مينفعش يتحذف');break}confirmBox('حذف العميل؟',()=>{S.clients=S.clients.filter(c=>c.id!==id);save();go('clients')});break}
    case 'addContract':openContractModal(id,null);break;
    case 'editContract':{const k=S.contracts.find(x=>x.id===id);openContractModal(k.clientId,id);break}
    case 'newFor':go('new');{const s=$('#f_client');if(s){s.value=id;s.onchange()}}break;
    case 'addPartRow':{const rows=$('#partRows');if(!S.parts.length){toast('ضيف قطع في المخزن الأول');break}if(rows.querySelector('.muted'))rows.innerHTML='';rows.insertAdjacentHTML('beforeend',partRowHTML());calc();break}
    case 'addPart':openPartModal(null);break;
    case 'editPart':openPartModal(id);break;
    case 'restock':openRestock(id);break;
    case 'mvPart':e.preventDefault();MV={part:id,client:'',from:'',to:''};STAB='moves';go('stock');break;
    case 'mvClient':MV={part:'',client:id,from:'',to:''};STAB='moves';go('stock');break;
    case 'collect':openCollect(t.dataset.type,id);break;
    case 'redue':openRedue(t.dataset.type,id);break;
    case 'reschedule':openReschedule(id);break;
    case 'cancelReq':confirmBox('إلغاء الطلب ده؟ الميعاد هيفضى لعيادة تانية.',()=>{const r=S.requests.find(x=>x.id===id);moveSlot(r.date,r.slot,null,null);r.status='cancelled';save();render()});break;
    case 'boardDay':BOARD=addDays(BOARD||today(),+t.dataset.d);render();break;
    case 'delPay':confirmBox('حذف التحصيل ده؟',()=>{S.payments=S.payments.filter(p=>p.id!==id);save();render()});break;
    case 'img':saveImage(id);break;
    case 'share':shareImage(id);break;
    case 'print':window.print();break;
    case 'delReport':confirmBox('حذف التقرير؟ قطع الغيار اللي فيه هترجع للمخزن.',()=>{const r=S.reports.find(x=>x.id===id);r.parts.forEach(p=>{const q=part(p.partId);if(q)q.qty=n(q.qty)+p.qty});S.reports=S.reports.filter(x=>x.id!==id);S.payments=S.payments.filter(p=>!(p.refType==='report'&&p.refId===id));save();go('reports')});break;
    case 'clearDemo':{if(ONLINE)break;const admins=S.users.filter(u=>u.role==='admin');S=emptyState();S.users=admins;save();toast('ابدأ ببيانات حقيقية');go('home');break}
    case 'export':{const b=new Blob([JSON.stringify(S)],{type:'application/json'});download(b,`pioneer-backup-${today()}.json`);break}
    case 'import':$('#importFile').click();break;
    case 'wipe':confirmBox('مسح كل البيانات نهائيًا؟ اعمل نسخة احتياطية الأول.',()=>{S=emptyState();ME=null;setSession(null);save();go('home')});break;
    case 'copyRules':{const txt=RULES;(navigator.clipboard?.writeText(txt)||Promise.reject()).then(()=>toast('اتنسخت القواعد')).catch(()=>{const r=document.createRange();r.selectNodeContents($('#rulesTxt'));const s=getSelection();s.removeAllRanges();s.addRange(r);toast('اتحددت — اعمل نسخ')});break}
    case 'connect':{const cfg=parseFbConfig($('#fb_cfg').value);if(!cfg){toast('الكود مش مظبوط — لازم يبقى فيه apiKey و projectId');break}if(!setFbConfig(cfg)){toast('المتصفح مش سامح بالحفظ');break}toast('بيتم الربط…');setTimeout(()=>location.reload(),600);break}
    case 'disconnect':confirmBox('إلغاء الربط على الجهاز ده؟ البيانات الأونلاين مش هتتمسح، بس الجهاز ده هيرجع يشتغل بالبيانات المحلية.',()=>{setFbConfig(null);location.reload()});break;
    case 'reconnect':try{localStorage.removeItem('pm-fb')}catch(e){}location.reload();break;
    case 'migrate':confirmBox('نقل بيانات الجهاز ده للأونلاين؟ لو عملتها قبل كده هتتكتب على نفس السجلات (من غير تكرار).',()=>migrateLocal());break;
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.assign){const r=S.requests.find(x=>x.id===t.dataset.assign);const u=S.users.find(x=>x.id===t.value);r.engineerId=u?.id||'';r.engineerName=u?.name||'';r.status=u?'assigned':'new';save();toast(u?`اتبعت لـ ${u.name}`:'اتشال المهندس');PENDING=false;render();return}
  if(t.id==='rt'){RT=t.value;render()}
  if(t.id==='boardDate'){BOARD=t.value||today();render()}
  if(['mv_part','mv_client','mv_from','mv_to'].includes(t.id)){MV[t.id.slice(3)]=t.value;render()}
});
document.addEventListener('input',e=>{
  if(e.target.id==='rq'||e.target.id==='sq'){if(e.target.id==='rq')RQ=e.target.value;else SQ=e.target.value;const p=e.target.selectionStart,idx=e.target.id;render();const i=$('#'+idx);i.focus();i.setSelectionRange(p,p)}
});
$('#importFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const fr=new FileReader();fr.onload=()=>{try{const d=JSON.parse(fr.result);if(!d.clients||!d.reports)throw 0;d.settings={...DEFAULT_SETTINGS,...d.settings};COLS.forEach(c=>d[c]=d[c]||[]);S=d;ME=S.users.find(u=>u.id===ME?.id)||null;if(!ME)setSession(null);save();toast('اتستوردت البيانات');go('home')}catch(_){toast('الملف ده مش نسخة احتياطية صحيحة')}};fr.readAsText(f);e.target.value=''};

/* =====================================================================
   التشغيل
   ===================================================================== */
setTimeout(()=>{const m=document.getElementById('main');if(m&&/بيحمّل/.test(m.textContent)){m.innerHTML='<div class="panel grid" style="max-width:520px;margin:30px auto"><h2>التحميل واخد وقت</h2><div class="muted">السيستم مش قادر يوصل لقاعدة البيانات. اتأكد إن النت شغال، وجرب واي فاي لو على باقة موبايل.</div><div class="row"><button class="btn pri" onclick="location.reload()">جرب تاني</button></div></div>'}},25000);
(async()=>{
  const cfg=getFbConfig();
  if(cfg){
    try{await initOnline(cfg);return}
    catch(e){
      S=emptyState();
      $('#main').innerHTML=`<div class="panel grid" style="max-width:520px;margin:30px auto"><h2>مش قادر أتصل</h2><div class="muted">السيستم مربوط أونلاين بس مش قادر يحمّل Firebase. اتأكد إن النت شغال وجرب تاني.</div><div class="row"><button class="btn pri" onclick="location.reload()">جرب تاني</button><button class="btn" data-act="disconnect">إلغاء الربط والرجوع للجهاز</button></div></div>`;
      return;
    }
  }
  try{S=await Promise.race([loadState(),new Promise(r=>setTimeout(()=>r(null),2500))])}catch(e){S=null}
  if(!S){S=demoState();save()}
  S.settings={...DEFAULT_SETTINGS,...S.settings};COLS.forEach(c=>S[c]=S[c]||[]);
  const sid=getSession();ME=S.users.find(u=>u.id===sid&&u.active!==false)||null;render();
})();
